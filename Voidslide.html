<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VoidSlide 3D - Neon Tunnel Runner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #020208; font-family: 'Segoe UI', sans-serif; user-select: none; touch-action: none; }
        #canvas-container { position: absolute; top:0; left:0; width:100%; height:100%; }
        .hud { position: absolute; z-index: 10; color: #fff; pointer-events: none; }
        .btn-neon { background: linear-gradient(135deg, #ff007f, #7928ca); border: 2px solid #ff007f; color: white; font-weight: bold; padding: 14px 28px; border-radius: 30px; box-shadow: 0 0 15px rgba(255,0,127,0.6); cursor: pointer; pointer-events: auto; transition: transform 0.1s; }
        .btn-neon:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- ANA MENÜ -->
    <div id="menu-overlay" class="absolute inset-0 z-20 flex flex-col items-center justify-center bg-black/80 backdrop-blur-md">
        <h1 class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-500 to-cyan-400 mb-2 tracking-widest drop-shadow-[0_0_15px_rgba(255,0,127,0.8)]">VOID SLIDE 3D</h1>
        <p class="text-gray-400 text-sm mb-6">Sonsuz Neon Boşluğunda Hayatta Kal</p>

        <input type="text" id="username" placeholder="Oyuncu Adı" class="bg-slate-900 border-2 border-pink-500 rounded-full px-6 py-3 text-white text-center font-bold mb-4 outline-none focus:box-shadow-[0_0_15px_#ff007f]" maxlength="12">

        <div class="bg-slate-900/80 border border-purple-500/30 rounded-2xl p-4 mb-6 text-center text-sm text-cyan-300">
            🏆 En Yüksek Skor: <span id="high-score-val" class="font-bold text-white">0</span> (<span id="high-score-user">Yok</span>)
        </div>

        <button class="btn-neon text-lg" onclick="startGame()">BOŞLUĞA DÜŞ 🚀</button>
    </div>

    <!-- OYUN HUD -->
    <div id="game-hud" class="hud top-5 left-5 right-5 flex justify-between items-center" style="display:none;">
        <div class="bg-slate-900/80 border border-cyan-500/50 rounded-xl px-4 py-2 font-mono text-cyan-400 text-lg font-bold">
            SKOR: <span id="score-text">0</span>
        </div>
        <div class="bg-slate-900/80 border border-pink-500/50 rounded-xl px-4 py-2 font-mono text-pink-500 text-lg font-bold">
            HIZ: <span id="speed-text">100</span> km/h
        </div>
    </div>

    <!-- OYUN BİTTİ -->
    <div id="gameover-overlay" class="absolute inset-0 z-30 flex flex-col items-center justify-center bg-black/90" style="display:none;">
        <h2 class="text-4xl font-black text-red-500 mb-2 tracking-wider">ÇARPIŞMA!</h2>
        <p id="final-score" class="text-white text-lg mb-6">Skorun: 0</p>
        <button class="btn-neon" onclick="resetToMenu()">MENÜYE DÖN</button>
    </div>

    <script>
        let scene, camera, renderer, tunnel, playerMesh;
        let angle = 0, speed = 0.8, score = 0, isPlaying = false;
        let obstacles = [], crystals = [];
        let playerUser = "Racer", highScore = parseInt(localStorage.getItem("vs_score")||"0"), highScoreUser = localStorage.getItem("vs_user")||"Yok";

        document.getElementById("high-score-val").innerText = highScore;
        document.getElementById("high-score-user").innerText = highScoreUser;

        function init() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x020208, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Tünel Oluşturma (Cylinder Inside Out)
            const tunnelGeo = new THREE.CylinderGeometry(8, 8, 300, 32, 1, true);
            const tunnelMat = new THREE.MeshBasicMaterial({
                color: 0x110022,
                wireframe: true,
                side: THREE.BackSide
            });
            tunnel = new THREE.Mesh(tunnelGeo, tunnelMat);
            tunnel.rotation.x = Math.PI / 2;
            scene.add(tunnel);

            // Oyuncu Küpü
            const pGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
            const pMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
            playerMesh = new THREE.Mesh(pGeo, pMat);
            scene.add(playerMesh);

            // Işıklandırma
            const light = new THREE.PointLight(0xff00ff, 2, 50);
            scene.add(light);

            window.addEventListener('resize', onWindowResize);
            setupControls();
        }

        let touchStartX = 0;
        function setupControls() {
            window.addEventListener('keydown', (e) => {
                if(!isPlaying) return;
                if(e.key === 'ArrowLeft' || e.key === 'a') angle -= 0.12;
                if(e.key === 'ArrowRight' || e.key === 'd') angle += 0.12;
            });

            window.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; });
            window.addEventListener('touchmove', (e) => {
                if(!isPlaying) return;
                let diff = e.touches[0].clientX - touchStartX;
                angle += diff * 0.003;
                touchStartX = e.touches[0].clientX;
            });
        }

        function spawnObstacle() {
            const obsGeo = new THREE.BoxGeometry(2, 2, 2);
            const obsMat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
            const obs = new THREE.Mesh(obsGeo, obsMat);
            
            let obsAngle = Math.random() * Math.PI * 2;
            let radius = 7.2;
            obs.position.x = Math.cos(obsAngle) * radius;
            obs.position.y = Math.sin(obsAngle) * radius;
            obs.position.z = camera.position.z - 200;
            scene.add(obs);
            obstacles.push(obs);
        }

        function startGame() {
            const nameInput = document.getElementById("username").value.trim();
            if(!nameInput) return alert("Lütfen adını gir!");

            playerUser = nameInput;
            document.getElementById("menu-overlay").style.display = "none";
            document.getElementById("gameover-overlay").style.display = "none";
            document.getElementById("game-hud").style.display = "flex";

            score = 0; speed = 0.8; angle = 0;
            obstacles.forEach(o => scene.remove(o));
            obstacles = [];
            isPlaying = true;
        }

        function gameOver() {
            isPlaying = false;
            document.getElementById("game-hud").style.display = "none";
            document.getElementById("gameover-overlay").style.display = "flex";
            document.getElementById("final-score").innerText = `${playerUser}, Skorun: ${Math.floor(score)}`;

            if(score > highScore) {
                highScore = Math.floor(score);
                highScoreUser = playerUser;
                localStorage.setItem("vs_score", highScore);
                localStorage.setItem("vs_user", highScoreUser);
            }
        }

        function resetToMenu() {
            document.getElementById("gameover-overlay").style.display = "none";
            document.getElementById("menu-overlay").style.display = "flex";
            document.getElementById("high-score-val").innerText = highScore;
            document.getElementById("high-score-user").innerText = highScoreUser;
        }

        let frameCount = 0;
        function animate() {
            requestAnimationFrame(animate);

            if(isPlaying) {
                frameCount++;
                score += speed;
                speed += 0.0003; // Gittikçe hızlanır!

                document.getElementById("score-text").innerText = Math.floor(score);
                document.getElementById("speed-text").innerText = Math.floor(speed * 120);

                // Oyuncu Tünel Yüzeyinde Dönüşü
                let radius = 7.2;
                playerMesh.position.x = Math.cos(angle) * radius;
                playerMesh.position.y = Math.sin(angle) * radius;
                playerMesh.position.z = camera.position.z - 10;
                playerMesh.rotation.z = angle;

                // Tüneli İlerletme Hissi
                tunnel.position.z += speed;
                if(tunnel.position.z > 50) tunnel.position.z = 0;

                // Engel Üretimi
                if(frameCount % Math.max(15, Math.floor(40 - speed * 10)) === 0) {
                    spawnObstacle();
                }

                // Engelleri Hareket Ettirme ve Çarpışma
                for(let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    obs.position.z += speed * 2;

                    // Çarpışma Testi
                    let dist = playerMesh.position.distanceTo(obs.position);
                    if(dist < 1.8) {
                        gameOver();
                        break;
                    }

                    if(obs.position.z > camera.position.z + 10) {
                        scene.remove(obs);
                        obstacles.splice(i, 1);
                    }
                }
            }

            renderer.render(scene, camera);
        }

        init();
        animate();

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
