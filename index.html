<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BladeStorm.io - Lobby</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; margin: 0; padding: 0; }
        body { 
            margin: 0; overflow-x: hidden; background: #060212; 
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif; color: #fff;
            min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between;
        }

        /* Arka Plan Neon Izgara Efekti */
        .bg-grid {
            position: fixed; inset: 0; z-index: 0;
            background-image: linear-gradient(to right, rgba(168, 85, 247, 0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(168, 85, 247, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
        }

        /* Glassmorphism Paneller */
        .glass-panel { 
            background: rgba(14, 8, 32, 0.85); 
            backdrop-filter: blur(20px); 
            border: 1.5px solid rgba(168, 85, 247, 0.4); 
            box-shadow: 0 15px 35px rgba(0,0,0,0.8); 
            border-radius: 24px; 
        }
        
        .glass-card { 
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.25), rgba(35, 10, 75, 0.5)); 
            border: 1px solid rgba(216, 180, 254, 0.3); 
            backdrop-filter: blur(10px); 
            border-radius: 18px; 
            transition: all 0.2s;
        }
        .glass-card:hover { border-color: rgba(216, 180, 254, 0.7); transform: translateY(-2px); }

        /* Butonlar */
        .btn-play { 
            background: linear-gradient(180deg, #22c55e 0%, #15803d 100%); 
            border: 2.5px solid #86efac; 
            box-shadow: 0 8px 25px rgba(34, 197, 94, 0.5); 
            border-radius: 20px; 
            transition: transform 0.1s; 
            cursor: pointer;
        }
        .btn-play:active { transform: scale(0.96); }

        .btn-action { 
            background: linear-gradient(180deg, #a855f7 0%, #6b21a8 100%); 
            border: 1.5px solid #e9d5ff; 
            box-shadow: 0 6px 18px rgba(168, 85, 247, 0.4); 
            border-radius: 16px; 
            transition: transform 0.1s; 
            cursor: pointer;
        }
        .btn-action:active { transform: scale(0.95); }

        .modal-overlay { 
            position: fixed; inset: 0; z-index: 1000; 
            background: rgba(3, 1, 8, 0.92); backdrop-filter: blur(16px); 
            display: none; align-items: center; justify-content: center; padding: 20px; 
        }

        /* Üst Menü Radar / Daire Alanı */
        .top-radar-badge {
            width: 90px; height: 90px; border-radius: 50%;
            background: rgba(14, 8, 32, 0.9);
            border: 2px solid rgba(168, 85, 247, 0.5);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
            display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden;
        }
        .radar-dot { width: 6px; height: 6px; background: #00f0ff; border-radius: 50%; box-shadow: 0 0 8px #00f0ff; position: absolute; }
    </style>
</head>
<body>

    <div class="bg-grid"></div>

    <!-- ÜST KISIM: Radar ve Altın Bakiyesi -->
    <header class="w-full p-5 flex justify-between items-center z-10 max-w-md mx-auto">
        <div class="top-radar-badge">
            <div class="radar-dot" style="top: 40px; left: 45px;"></div>
            <div class="radar-dot" style="top: 30px; left: 60px; background: #fff; width: 4px; height: 4px;"></div>
            <div class="radar-dot" style="top: 60px; left: 30px; background: #fff; width: 4px; height: 4px;"></div>
        </div>

        <div class="glass-panel px-5 py-2.5 flex items-center gap-2 shadow-lg">
            <span class="text-xl">🪙</span>
            <span id="coin-amount" class="text-yellow-400 font-black text-base font-mono">150</span>
        </div>
    </header>

    <!-- ORTA KISIM: Logo ve Ana Menü Paneli -->
    <main class="w-full px-5 flex flex-col items-center justify-center z-10 max-w-md mx-auto my-auto">
        <!-- Logo -->
        <h1 class="text-5xl sm:text-6xl font-black mb-6 tracking-tighter text-center" style="font-family: 'Secular One', sans-serif;">
            <span class="text-cyan-400">B</span><span class="text-rose-400">l</span><span class="text-emerald-400">a</span><span class="text-yellow-400">d</span><span class="text-cyan-400">e</span><span class="text-rose-400">S</span><span class="text-emerald-400">t</span><span class="text-yellow-400">o</span><span class="text-cyan-400">r</span><span class="text-rose-400">m</span><span class="text-emerald-400">.</span><span class="text-yellow-400">i</span><span class="text-cyan-400">o</span>
        </h1>

        <!-- Ana Kontrol Kartı -->
        <div class="glass-panel p-6 w-full flex flex-col gap-4 text-center shadow-2xl">
            <!-- Nickname -->
            <div class="glass-card p-3.5 flex items-center justify-center text-white font-bold text-base tracking-wide border border-purple-400/40">
                <span id="player-nickname">Shedx</span>
            </div>

            <!-- Server Seçici -->
            <div class="glass-card p-3.5 flex items-center justify-between text-purple-200 font-semibold text-xs border border-purple-500/30 cursor-pointer">
                <span>🌍 Europe Server (#4490)</span>
                <span class="text-purple-400">▼</span>
            </div>

            <!-- Play Online Butonu -->
            <button class="btn-play w-full py-4 text-white font-black text-xl tracking-wider flex items-center justify-center gap-3 shadow-xl" onclick="alert('Oyun motoru sonra eklenecek! Şu an kusursuz arayüz testindeyiz.')">
                <span>PLAY ONLINE!</span>
                <span class="text-2xl">▶</span>
            </button>
            
            <!-- Play vs AI Butonu -->
            <button class="btn-action w-full py-3.5 text-white font-black text-sm shadow-lg" onclick="alert('Yapay zeka modu hazırlanıyor!')">
                PLAY VS A.I.
            </button>
        </div>
    </main>

    <!-- ALT KISIM: 4 Temel Menü İkonu -->
    <footer class="w-full p-5 z-10 max-w-md mx-auto">
        <div class="grid grid-cols-4 gap-3">
            <button class="btn-action py-4 text-2xl flex items-center justify-center shadow-xl hover:scale-105 transition" id="open-skins">🗡️</button>
            <button class="btn-action py-4 text-2xl flex items-center justify-center shadow-xl hover:scale-105 transition" id="open-market">🛒</button>
            <button class="btn-action py-4 text-2xl flex items-center justify-center shadow-xl hover:scale-105 transition" id="open-quests">📜</button>
            <button class="btn-action py-4 text-2xl flex items-center justify-center shadow-xl hover:scale-105 transition" id="daily-reward-btn">🎁</button>
        </div>
    </footer>

    <!-- MODALLAR (Açılır Pencereler) -->
    <!-- Skin Seçim Modalı -->
    <div id="skins-modal" class="modal-overlay">
        <div class="glass-panel p-6 max-w-sm w-full text-white">
            <div class="flex justify-between items-center mb-4 border-b border-white/10 pb-3">
                <h3 class="font-black text-lg text-cyan-400">🗡️ KARAKTER SKİNLERİ</h3>
                <button class="close-modal text-purple-300 hover:text-white font-bold text-lg">✕</button>
            </div>
            <div class="grid grid-cols-3 gap-3 mb-5">
                <div class="glass-card p-3 text-center cursor-pointer border-2 border-cyan-400 skin-item">
                    <div class="w-10 h-10 mx-auto rounded-full bg-cyan-400 mb-2 shadow-[0_0_10px_#00f0ff]"></div>
                    <span class="text-xs font-bold">Siyan</span>
                </div>
                <div class="glass-card p-3 text-center cursor-pointer skin-item">
                    <div class="w-10 h-10 mx-auto rounded-full bg-rose-500 mb-2 shadow-[0_0_10px_#ff0055]"></div>
                    <span class="text-xs font-bold">Kırmızı</span>
                </div>
                <div class="glass-card p-3 text-center cursor-pointer skin-item">
                    <div class="w-10 h-10 mx-auto rounded-full bg-emerald-500 mb-2 shadow-[0_0_10px_#10b981]"></div>
                    <span class="text-xs font-bold">Yeşil</span>
                </div>
            </div>
            <button class="btn-play w-full py-3 font-black text-sm close-modal">KAYDET</button>
        </div>
    </div>

    <!-- Mağaza Modalı -->
    <div id="market-modal" class="modal-overlay">
        <div class="glass-panel p-6 max-w-sm w-full text-white">
            <div class="flex justify-between items-center mb-4 border-b border-white/10 pb-3">
                <h3 class="font-black text-lg text-yellow-400">🛒 MAĞAZA</h3>
                <button class="close-modal text-purple-300 hover:text-white font-bold text-lg">✕</button>
            </div>
            <div class="space-y-3 mb-4">
                <div class="glass-card p-3 flex justify-between items-center">
                    <div><div class="font-bold text-sm">1,000 Altın</div><div class="text-xs text-green-400">$0.49 USD</div></div>
                    <button class="btn-play px-4 py-1.5 text-xs font-black">SATIN AL</button>
                </div>
            </div>
            <button class="btn-action w-full py-2.5 font-bold text-xs close-modal">KAPAT</button>
        </div>
    </div>

    <!-- Görevler Modalı -->
    <div id="quests-modal" class="modal-overlay">
        <div class="glass-panel p-6 max-w-sm w-full text-white">
            <div class="flex justify-between items-center mb-4 border-b border-white/10 pb-3">
                <h3 class="font-black text-lg text-yellow-400">📜 GÖREVLER</h3>
                <button class="close-modal text-purple-300 hover:text-white font-bold text-lg">✕</button>
            </div>
            <div class="space-y-2 mb-4 text-xs font-mono">
                <div class="glass-card p-3 flex justify-between"><span>2 Oyun Oyna</span><span class="text-yellow-400">200 🪙</span></div>
            </div>
            <button class="btn-action w-full py-2.5 font-bold text-xs close-modal">KAPAT</button>
        </div>
    </div>

    <!-- Günlük Ödül Modalı -->
    <div id="daily-modal" class="modal-overlay">
        <div class="glass-panel p-6 max-w-sm w-full text-white text-center">
            <div class="text-5xl mb-2">🎁</div>
            <h3 class="font-black text-xl text-yellow-400 mb-2">GÜNLÜK ÖDÜL</h3>
            <p class="text-xs text-purple-200 mb-4">Ücretsiz 300 altınını al!</p>
            <button class="btn-play w-full py-3 font-black text-sm mb-2" onclick="alert('Altın eklendi!'); document.getElementById('daily-modal').style.display='none';">300 ALTINI AL</button>
            <button class="btn-action w-full py-2 font-bold text-xs close-modal">KAPAT</button>
        </div>
    </div>

    <!-- JavaScript: Modalları Çalıştırma -->
    <script>
        document.getElementById('open-skins').addEventListener('click', () => document.getElementById('skins-modal').style.display = 'flex');
        document.getElementById('open-market').addEventListener('click', () => document.getElementById('market-modal').style.display = 'flex');
        document.getElementById('open-quests').addEventListener('click', () => document.getElementById('quests-modal').style.display = 'flex');
        document.getElementById('daily-reward-btn').addEventListener('click', () => document.getElementById('daily-modal').style.display = 'flex');

        document.querySelectorAll('.close-modal').forEach(b => {
            b.addEventListener('click', () => {
                document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none');
            });
        });
    </script>
</body>
</html>
