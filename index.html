<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlayByte - Galaxy War Ultimate</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #010106;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            overflow: hidden;
            touch-action: none;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 4px;
        }
        header {
            padding: 4px;
            background: linear-gradient(180deg, #0a0a20, transparent);
        }
        h1 {
            color: #00f0ff;
            font-size: 16px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0,240,255,0.8);
        }
        .stats-bar {
            display: flex;
            justify-content: space-around;
            font-size: 11px;
            color: #b0b0f0;
            margin-top: 2px;
        }
        .stats-bar span {
            color: #ff0055;
            font-weight: bold;
        }
        .main-layout {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            flex-grow: 1;
        }
        .side-market {
            width: 92px;
            background: rgba(10, 10, 30, 0.95);
            border: 1px solid #00f0ff;
            border-radius: 8px;
            padding: 5px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            box-shadow: 0 0 12px rgba(0,240,255,0.3);
            max-height: 410px;
            overflow-y: auto;
        }
        .side-market h3 {
            font-size: 9px;
            color: #00f0ff;
            margin-bottom: 2px;
        }
        .market-btn {
            background: linear-gradient(45deg, #ff0055, #7f00ff);
            color: #fff;
            border: none;
            padding: 5px 2px;
            font-size: 8px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 2px 4px rgba(255,0,85,0.4);
            transition: transform 0.1s;
        }
        .market-btn:active {
            transform: scale(0.95);
        }
        #gameCanvas {
            background: radial-gradient(circle at center, #101035 0%, #02020a 100%);
            display: block;
            border-radius: 8px;
            border: 1px solid #00f0ff;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
        }
        .hud-panel {
            padding: 4px;
            background: #080816;
            display: flex;
            justify-content: space-around;
            border-radius: 6px;
        }
        .btn {
            background: linear-gradient(45deg, #00f0ff, #0055ff);
            color: #000;
            border: none;
            padding: 5px 12px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
        }
        /* Reklam İzleme Overlay Ekranı */
        #adOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 2, 10, 0.95);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .ad-box {
            background: #101030;
            border: 2px solid #00f0ff;
            padding: 20px;
            border-radius: 10px;
            width: 280px;
            box-shadow: 0 0 20px rgba(0,240,255,0.5);
        }
    </style>
</head>
<body>

    <!-- REKLAM İZLEME EKRANI -->
    <div id="adOverlay">
        <div class="ad-box">
            <h3 style="color: #00f0ff; margin-bottom: 10px;">REKLAM OYNATILIYOR</h3>
            <p id="adTimerText" style="font-size: 13px; color: #aaa; margin-bottom: 15px;">Lütfen bekleyin... 3s</p>
            <div style="background: #222; height: 6px; border-radius: 3px; overflow: hidden;">
                <div id="adProgressBar" style="background: #ff0055; width: 100%; height: 100%; transition: width 1s linear;"></div>
            </div>
        </div>
    </div>

    <header>
        <h1>⚡ GALAXY WAR REWARDED</h1>
        <div class="stats-bar">
            <div>SKOR: <span id="scoreVal">0</span></div>
            <div>💎 <span id="coinVal">0</span></div>
            <div>CAN: <span id="lifeVal">❤️❤️❤️</span></div>
        </div>
    </header>

    <div class="main-layout">
        <div class="side-market">
            <h3>MARKET</h3>
            <button class="market-btn" onclick="upgradeSystem('laser')">Çift Lazer<br>(15 💎)</button>
            <button class="market-btn" onclick="upgradeSystem('spread')">Yan Ateş<br>(20 💎)</button>
            <button class="market-btn" onclick="upgradeSystem('beam')">Mega Işın<br>(35 💎)</button>
            <button class="market-btn" onclick="upgradeSystem('shield')">Kalkan<br>(25 💎)</button>
            <button class="market-btn" onclick="upgradeSystem('speed')">Hız<br>(15 💎)</button>
            <!-- REKLAM İLE ELMAS KAZAN BUTONU -->
            <button class="market-btn" style="background: linear-gradient(45deg, #00ffaa, #0055ff);" onclick="watchRewardedAd()">Reklam İzle<br>(+15 💎)</button>
        </div>

        <canvas id="gameCanvas" width="260" height="390"></canvas>
    </div>

    <div class="hud-panel">
        <button class="btn" onclick="togglePause()">DURDUR</button>
        <button class="btn" style="background: linear-gradient(45deg, #ff0055, #ffaa00);" onclick="resetGame()">YENİDEN</button>
        <button class="btn" style="background: linear-gradient(45deg, #00ffaa, #0055ff); color:#fff;" onclick="triggerSmartBomb()">BOMBA 💣</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const scoreVal = document.getElementById("scoreVal");
        const coinVal = document.getElementById("coinVal");
        const lifeVal = document.getElementById("lifeVal");
        const adOverlay = document.getElementById("adOverlay");
        const adTimerText = document.getElementById("adTimerText");
        const adProgressBar = document.getElementById("adProgressBar");

        let score = 0;
        let coins = 0;
        let lives = 3;
        let isPaused = false;
        let gameOver = false;
        let gameStarted = false;
        let level = 1;
        let screenShake = 0;
        let smartBombs = 1;

        let upgrades = { laser: 0, spread: 0, beam: 0, shield: 0, speed: 0 };

        let bossActive = false;
        let boss = { x: 75, y: -90, w: 100, h: 56, hp: 180, maxHp: 180, dir: 2.5, phase: 1 };

        let player = { x: canvas.width / 2, y: canvas.height - 45, w: 40, h: 40, speed: 5 };

        let bullets = [];
        let enemies = [];
        let particles = [];
        let floatingTexts = [];
        let stars = [];

        for (let i = 0; i < 80; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 1.8 + 0.3,
                speed: Math.random() * 1.3 + 0.3
            });
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                let now = audioCtx.currentTime;

                if (type === 'laser') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(700, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.08);
                    gain.gain.setValueAtTime(0.04, now);
                    gain.gain.linearRampToValueAtTime(0.001, now + 0.08);
                    osc.start(now); osc.stop(now + 0.08);
                } else if (type === 'explosion') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.linearRampToValueAtTime(20, now + 0.3);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.linearRampToValueAtTime(0.001, now + 0.3);
                    osc.start(now); osc.stop(now + 0.3);
                } else if (type === 'powerup') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(500, now);
                    osc.frequency.exponentialRampToValueAtTime(1200, now + 0.2);
                    gain.gain.setValueAtTime(0.06, now);
                    gain.gain.linearRampToValueAtTime(0.001, now + 0.2);
                    osc.start(now); osc.stop(now + 0.2);
                }
            } catch (e) {}
        }

        // ÖDÜLLÜ REKLAM MANTIĞI
        let isWatchingAd = false;
        function watchRewardedAd() {
            if (isWatchingAd) return;
            isWatchingAd = true;
            isPaused = true;
            adOverlay.style.display = "flex";

            let timeLeft = 3;
            adTimerText.innerText = `Lütfen bekleyin... ${timeLeft}s`;
            adProgressBar.style.width = "100%";

            let countdown = setInterval(() => {
                timeLeft--;
                adTimerText.innerText = `Lütfen bekleyin... ${timeLeft}s`;
                adProgressBar.style.width = (timeLeft * 33.3) + "%";

                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    adOverlay.style.display = "none";
                    coins += 15;
                    playSound('powerup');
                    addText("+15 💎 ÖDÜL!", player.x, player.y, "#00ffaa");
                    isWatchingAd = false;
                    isPaused = false;
                }
            }, 1000);
        }

        let touchX = player.x;
        let isTouching = false;
        canvas.addEventListener("pointerdown", (e) => {
            isTouching = true; updateTouchPos(e);
            if (!gameStarted || gameOver) resetGame();
        });
        canvas.addEventListener("pointermove", (e) => { if (isTouching) updateTouchPos(e); });
        canvas.addEventListener("pointerup", () => { isTouching = false; });

        function updateTouchPos(e) {
            const rect = canvas.getBoundingClientRect();
            touchX = e.clientX - rect.left;
        }

        let keys = {};
        window.addEventListener("keydown", (e) => {
            keys[e.code] = true;
            if(e.code === "Space" && (!gameStarted || gameOver)) resetGame();
        });
        window.addEventListener("keyup", (e) => { keys[e.code] = false; });

        function resetGame() {
            score = 0; coins = 0; lives = 3; level = 1; smartBombs = 1;
            bullets = []; enemies = []; particles = []; floatingTexts = [];
            upgrades = { laser: 0, spread: 0, beam: 0, shield: 0, speed: 0 };
            bossActive = false; gameOver = false; gameStarted = true;
            player.speed = 5;
        }

        function togglePause() { if (gameStarted && !gameOver && !isWatchingAd) isPaused = !isPaused; }

        function upgradeSystem(type) {
            if (type === 'laser' && coins >= 15 && upgrades.laser < 2) { coins -= 15; upgrades.laser++; playSound('powerup'); addText("ÇİFT LAZER!", player.x, player.y, "#00f0ff"); }
            else if (type === 'spread' && coins >= 20 && upgrades.spread < 2) { coins -= 20; upgrades.spread++; playSound('powerup'); addText("YAN ATEŞ!", player.x, player.y, "#ffaa00"); }
            else if (type === 'beam' && coins >= 35 && upgrades.beam < 1) { coins -= 35; upgrades.beam++; playSound('powerup'); addText("MEGA IŞIN!", player.x, player.y, "#ff0055"); }
            else if (type === 'shield' && coins >= 25 && upgrades.shield < 1) { coins -= 25; upgrades.shield++; playSound('powerup'); addText("KALKAN!", player.x, player.y, "#00ffcc"); }
            else if (type === 'speed' && coins >= 15 && upgrades.speed < 2) { coins -= 15; upgrades.speed++; player.speed += 1.5; playSound('powerup'); addText("HIZ ARTTI!", player.x, player.y, "#00ffaa"); }
        }

        function triggerSmartBomb() {
            if (smartBombs > 0 && gameStarted && !gameOver && !isWatchingAd) {
                smartBombs--; screenShake = 15;
                enemies = []; playSound('explosion');
                addText("BOMBA!", canvas.width/2, canvas.height/2, "#ff0055");
            }
        }

        function createExplosion(x, y, color) {
            screenShake = 8;
            for (let i = 0; i < 14; i++) {
                particles.push({ x, y, vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6, radius: Math.random() * 3 + 1, color, alpha: 1 });
            }
        }

        function addText(text, x, y, color) {
            floatingTexts.push({ text, x, y, alpha: 1, color });
        }

        let frameCount = 0;
        function update() {
            if (!gameStarted || isPaused || gameOver || isWatchingAd) return;

            frameCount++;
            level = Math.floor(score / 150) + 1;
            if (screenShake > 0) screenShake--;

            if (score > 0 && score % 200 === 0 && !bossActive) {
                bossActive = true; boss.hp = 180 + level * 50; boss.maxHp = boss.hp; boss.y = -70;
            }

            stars.forEach(s => { s.y += s.speed; if (s.y > canvas.height) s.y = 0; });

            if (isTouching) {
                let dx = touchX - player.x;
                player.x += dx * 0.3;
            }
            if (keys["ArrowLeft"] || keys["KeyA"]) player.x -= player.speed;
            if (keys["ArrowRight"] || keys["KeyD"]) player.x += player.speed;

            if (player.x < player.w / 2) player.x = player.w / 2;
            if (player.x > canvas.width - player.w / 2) player.x = canvas.width - player.w / 2;

            if (frameCount % 8 === 0) {
                if (upgrades.beam > 0) bullets.push({ x: player.x, y: 0, w: 12, h: player.y - 10, isBeam: true, color: '#ff0055' });
                if (upgrades.spread > 0) {
                    bullets.push({ x: player.x - 14, y: player.y - 15, vx: -3, vy: -13, w: 4, h: 12, color: '#ff5500', isBeam: false });
                    bullets.push({ x: player.x + 14, y: player.y - 15, vx: 3, vy: -13, w: 4, h: 12, color: '#ff5500', isBeam: false });
                }
                if (upgrades.laser > 0) {
                    bullets.push({ x: player.x - 7, y: player.y - 15, vx: 0, vy: -14, w: 4, h: 15, color: '#00f0ff', isBeam: false });
                    bullets.push({ x: player.x + 7, y: player.y - 15, vx: 0, vy: -14, w: 4, h: 15, color: '#00f0ff', isBeam: false });
                } else {
                    bullets.push({ x: player.x, y: player.y - 15, vx: 0, vy: -14, w: 4, h: 15, color: '#ffaa00', isBeam: false });
                }
                playSound('laser');
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                if (b.isBeam) {
                    b.x = player.x; b.h = player.y - 10;
                    if (frameCount % 12 === 4) bullets.splice(i, 1);
                } else {
                    b.x += b.vx; b.y += b.vy;
                    if (b.y < 0 || b.x < 0 || b.x > canvas.width) bullets.splice(i, 1);
                }
            }

            if (!bossActive && frameCount % Math.max(18, 45 - level * 3) === 0) {
                enemies.push({ x: Math.random() * (canvas.width - 32), y: -35, w: 32, h: 32, hp: 1, speed: 2.2 + level * 0.15, color: '#00f0ff' });
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.y += e.speed;

                let dist = Math.hypot(player.x - (e.x + e.w/2), player.y - (e.y + e.h/2));
                if (dist < player.w / 2 + e.w / 2) {
                    if (upgrades.shield > 0) { upgrades.shield = 0; addText("KALKAN!", player.x, player.y, "#00f0ff"); }
                    else { lives--; }
                    createExplosion(e.x + e.w/2, e.y + e.h/2, '#ff0055');
                    playSound('explosion');
                    enemies.splice(i, 1);
                    if (lives <= 0) gameOver = true;
                    continue;
                }

                if (e.y > canvas.height) { enemies.splice(i, 1); continue; }

                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j];
                    let hit = b.isBeam ? (b.x > e.x && b.x < e.x + e.w) : (b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h);
                    if (hit) {
                        if (!b.isBeam) bullets.splice(j, 1);
                        e.hp--;
                        createExplosion(e.x + e.w/2, e.y + e.h/2, e.color);
                        if (e.hp <= 0) {
                            coins += Math.random() < 0.5 ? 1 : 0;
                            score += 10;
                            playSound('explosion');
                            addText("+10", e.x, e.y, "#00f0ff");
                            enemies.splice(i, 1);
                        }
                        break;
                    }
                }
            }

            if (bossActive) {
                if (boss.y < 35) boss.y += 1;
                boss.x += boss.dir;
                if (boss.x < 15 || boss.x > canvas.width - 120) boss.dir *= -1;

                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j];
                    let hit = b.isBeam ? (b.x > boss.x && b.x < boss.x + boss.w) : (b.x > boss.x && b.x < boss.x + boss.w && b.y > boss.y && b.y < boss.y + boss.h);
                    if (hit) {
                        if (!b.isBeam) bullets.splice(j, 1);
                        boss.hp--;
                        createExplosion(b.x, b.y, '#ff0055');
                        if (boss.hp <= 0) {
                            bossActive = false;
                            score += 250; coins += 35;
                            playSound('explosion');
                            addText("+250 BOSS", boss.x, boss.y, "#ff0055");
                        }
                    }
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.alpha -= 0.03;
                if (p.alpha <= 0) particles.splice(i, 1);
            }

            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                let ft = floatingTexts[i];
                ft.y -= 1; ft.alpha -= 0.015;
                if (ft.alpha <= 0) floatingTexts.splice(i, 1);
            }

            scoreVal.innerText = score;
            coinVal.innerText = coins;
            lifeVal.innerText = "❤️".repeat(Math.max(0, lives));
        }

        function draw() {
            ctx.save();
            if (screenShake > 0) ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#ffffff";
            stars.forEach(s => {
                ctx.globalAlpha = s.size / 2.2;
                ctx.fillRect(s.x, s.y, s.size, s.size);
            });
            ctx.globalAlpha = 1;

            particles.forEach(p => {
                ctx.save(); ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill(); ctx.restore();
            });

            floatingTexts.forEach(ft => {
                ctx.save(); ctx.globalAlpha = ft.alpha; ctx.fillStyle = ft.color;
                ctx.font = "bold 11px Arial"; ctx.fillText(ft.text, ft.x, ft.y); ctx.restore();
            });

            if (!gameStarted) {
                ctx.fillStyle = "rgba(1, 1, 6, 0.94)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#00f0ff"; ctx.font = "bold 18px Arial"; ctx.textAlign = "center";
                ctx.fillText("GALAXY WAR REWARDED", canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = "#ffffff"; ctx.font = "11px Arial";
                ctx.fillText("Başlamak İçin Dokun", canvas.width / 2, canvas.height / 2 + 15);
                ctx.textAlign = "left"; ctx.restore(); return;
            }

            if (bossActive) {
                ctx.fillStyle = "#ff0055"; ctx.fillRect(boss.x, boss.y, boss.w, boss.h);
                ctx.fillStyle = "#111"; ctx.fillRect(boss.x, boss.y - 10, boss.w, 6);
                ctx.fillStyle = "#ff0055"; ctx.fillRect(boss.x, boss.y - 10, boss.w * (boss.hp / boss.maxHp), 6);
            }

            bullets.forEach(b => {
                ctx.shadowBlur = 10; ctx.shadowColor = b.color;
                ctx.fillStyle = b.color;
                if (b.isBeam) ctx.fillRect(b.x - b.w/2, 0, b.w, b.h);
                else { ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI * 2); ctx.fill(); }
            });
            ctx.shadowBlur = 0;

            let x = player.x, y = player.y;
            ctx.shadowBlur = 14; ctx.shadowColor = "#00f0ff";
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.moveTo(x, y - 22); ctx.lineTo(x - 16, y + 12); ctx.lineTo(x, y + 6); ctx.lineTo(x + 16, y + 12);
            ctx.closePath(); ctx.fill();

            ctx.fillStyle = "#00a2ff";
            ctx.beginPath(); ctx.moveTo(x - 12, y + 2); ctx.lineTo(x - 27, y + 16); ctx.lineTo(x - 10, y + 10); ctx.closePath(); ctx.fill();
            ctx.beginPath(); ctx.moveTo(x + 12, y + 2); ctx.lineTo(x + 27, y + 16); ctx.lineTo(x + 10, y + 10); ctx.closePath(); ctx.fill();

            ctx.fillStyle = "#ff5500";
            ctx.fillRect(x - 4, y + 12, 3, 10);
            ctx.fillRect(x + 1, y + 12, 3, 10);
            ctx.shadowBlur = 0;

            if (upgrades.shield > 0) {
                ctx.strokeStyle = "#00ffff"; ctx.lineWidth = 2.5;
                ctx.beginPath(); ctx.arc(x, y, 28, 0, Math.PI * 2); ctx.stroke();
            }

            enemies.forEach(e => {
                let ex = e.x + e.w/2, ey = e.y + e.h/2;
                ctx.fillStyle = e.color;
                ctx.beginPath(); ctx.arc(ex, ey, 12, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = "#ffffff";
                ctx.beginPath(); ctx.arc(ex - 11, ey - 4, 5, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(ex + 11, ey - 4, 5, 0, Math.PI * 2); ctx.fill();
            });

            if (gameOver) {
                ctx.fillStyle = "rgba(1, 1, 6, 0.97)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ff0055"; ctx.font = "bold 22px Arial"; ctx.textAlign = "center";
                ctx.fillText("OYUN BİTTİ", canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = "#ffffff"; ctx.font = "12px Arial";
                ctx.fillText("Toplam Skor: " + score, canvas.width / 2, canvas.height / 2 + 10);
                ctx.fillText("Tekrar Başlamak İçin Dokun", canvas.width / 2, canvas.height / 2 + 38);
                ctx.textAlign = "left";
            }

            ctx.restore();
        }

        function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }
        gameLoop();
    </script>
</body>
</html>
