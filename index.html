<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayByte - Oyun ve Eğlence Portalı</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        h1 {
            color: #00ffcc;
        }
        .card {
            background-color: #2a2a2a;
            border-radius: 10px;
            padding: 15px;
            margin: 15px auto;
            max-width: 300px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        button {
            background-color: #00ffcc;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>PlayByte'a Hoş Geldiniz!</h1>
    <p>Burada harika mini oyunlar ve araçlar olacak.</p>

    <div class="card">
        <h3>Mini Tıklama Oyunu</h3>
        <p>Puan: <span id="score">0</span></p>
        <button onclick="increaseScore()">Tıkla ve Kazan!</button>
    </div>

    <script>
        let count = 0;
        function increaseScore() {
            count++;
            document.getElementById('score').innerText = count;
        }
    </script>

</body>
</html>
