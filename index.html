<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Color Conquest 3D - Territorial Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #050510; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; touch-action: none; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .hud { position: absolute; z-index: 10; color: #fff; pointer-events: none; }
        .btn-io { background: linear-gradient(135deg, #00f0ff, #7000ff); border: 2px solid #00f0ff; color: #fff; font-weight: 900; padding: 16px 32px; border-radius: 40px; box-shadow: 0 0 25px rgba(0,240,255,0.6); cursor: pointer; pointer-events: auto; transition: transform 0.1s; text-transform: uppercase; letter-spacing: 2px; }
        .btn-io:active { transform: scale(0.95); }
        .io-input { background: rgba(10, 10, 30, 0.9); border: 2px solid #00f0ff; border-radius: 30px; padding: 14px 24px; color: #fff; text-align: center; font-weight: bold; outline: none; box-shadow: 0 0 15px rgba(0,240,255,0.3); }
        .io-panel { background: rgba(10, 10, 30, 0.9); border: 2px solid rgba(0,240,255,0.4); backdrop-filter: blur(12px); border-radius: 20px; box-shadow: 0 0 30px rgba(0,240,255,0.2); }
        .skin-btn { width: 38px; height: 38px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; pointer-events: auto; transition: transform 0.2s; }
        .skin-btn.selected { transform: scale(1.25); border-color: #00f0ff; box-shadow: 0 0 15px #00f0ff; }
        .control-btn { background: rgba(0, 240, 255, 0.2); border: 2px solid #00f0ff; color: #00f0ff; font-size: 22px; font-weight: bold; width: 65px; height: 65px; border-radius: 50%; display: flex; align-items: center; justify-content: center; pointer-events: auto; cursor: pointer; user-select: none; box-shadow: 0 0 15px rgba(0,240,255,0.3); }
        .control-btn:active { background: rgba(0, 240, 255, 0.5); transform: scale(0.9); }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- ANA MENÜ -->
    <div id="menu-overlay" class="absolute inset-0 z-30 flex flex-col items-center justify-center bg-black/90 px-4">
        <div class="io-panel p-8 max-w-sm w-full text-center flex flex-col items-center">
            <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-purple-500 to-pink-500 mb-1 tracking-widest drop-shadow-[0_0_20px_rgba(0,240,255,0.8)]">COLOR<span class="text-cyan-400">.IO</span></h1>
            <p class="text-xs text-cyan-300 font-mono mb-6 uppercase tracking-widest">3D Bölge Ele Geçirme Arenası</p>

            <input type="text" id="username" placeholder="OYUNCU ADI" class="io-input w-full mb-4 text-sm" maxlength="12">

            <!-- Renk Seçimi -->
            <div class="mb-6 w-full">
                <p class="text-xs text-gray-400 mb-2 font-mono">BOYA RENGİNİ SEÇ</p>
                <div class="flex justify-center gap-4">
                    <div class="skin-btn selected" style="background:#00f0ff;" onclick="setSkin(0x00f0ff, this)"></div>
                    <div class="skin-btn" style="background:#ff0055;" onclick="setSkin(0xff0055, this)"></div>
                    <div class="skin-btn" style="background:#00ff66;" onclick="setSkin(0x00ff66, this)"></div>
                    <div class="skin-btn" style="background:#aa00ff;" onclick="setSkin(0xaa00ff, this)"></div>
                </div>
            </div>

            <button class="btn-io w-full text-base" onclick="startGame()">ARENAYA GİR 🎨</button>
        </div>
    </div>

    <!-- OYUN HUD & LİDERLİK TABLOSU -->
    <div id="game-hud" class="hud top-4 left-4 right-4 flex justify-between items-start" style="display:none;">
        <div class="io-panel px-4 py-2 font-mono text-cyan-400 text-sm font-black flex flex-col gap-1">
            <div>BÖLGE: <span id="area-text" class="text-white text-base">5.0%</span></div>
            <div>SKOR: <span id="score-text" class="text-yellow-400">0</span></div>
        </div>

        <!-- Canlı Liderlik Tablosu -->
        <div class="io-panel px-4 py-3 font-mono text-xs text-white min-w-[160px]">
            <div class="text-cyan-400 font-bold mb-2 border-b border-cyan-500/30 pb-1">🏆 HAKİMİYET LİDERLERİ</div>
            <div id="leaderboard-list" class="flex flex-col gap-1 text-gray-300"></div>
        </div>
    </div>

    <!-- MOBİL YÖN BUTONLARI -->
    <div id="game-controls" class="hud bottom-6 left-1/2 -translate-x-1/2 flex gap-4" style="display:none;">
        <div class="control-btn" ontouchstart="changeDir(0, -1)" onmousedown="changeDir(0, -1)">▲</div>
        <div class="flex gap-4">
            <div class="control-btn" ontouchstart="changeDir(-1, 0)" onmousedown="changeDir(-1, 0)">◀</div>
            <div class="control-btn" ontouchstart="changeDir(0, 1)" onmousedown="changeDir(0, 1)">▼</div>
            <div class="control-btn" ontouchstart="changeDir(1, 0)" onmousedown="changeDir(1, 0)">▶</div>
        </div>
    </div>

    <!-- OYUN BİTTİ EKRANI -->
    <div id="gameover-overlay" class="absolute inset-0 z-40 flex flex-col items-center justify-center bg-black/95 px-4" style="display:none;">
        <div class="io-panel p-8 max-w-sm w-full text-center flex flex-col items-center border-cyan-500/60 shadow-[0_0_40px_rgba(0,240,255,0.3)]">
            <h2 class="text-3xl font-black text-cyan-400 mb-1 tracking-wider drop-shadow-[0_0_10px_#00f0ff]">BÖLGEN ÇALINDI</h2>
            <p id="final-rank" class="text-pink-400 font-bold text-sm mb-2 font-mono">Sıralama: #1</p>
            <p id="final-score" class="text-gray-300 text-sm mb-6 font-mono">Bölge Kaplama: 12.4%</p>
            <button class="btn-io w-full text-base" onclick="returnToMenu()">TEKRAR DENE</button>
        </div>
    </div>

    <script>
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        function playSound(type) {
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            let now = audioCtx.currentTime;

            if (type === 'paint') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(700, now + 0.15);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'crash') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(40, now + 0.4);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now); osc.stop(now + 0.4);
            }
        }

        let scene, camera, renderer, playerMesh;
        let isPlaying = false;
        let playerColor = 0x00f0ff;
        let playerUser = "Racer";
        let dirX = 1, dirZ = 0;
        let pX = 0, pZ = 0;
        let grid = {}; // Harita Izgarası
        let trail = []; // Bırakılan İz
        let score = 0, coveredArea = 5.0;
        let bots = [];

        const GRID_SIZE = 40;
        const botNames = ["PaintKing", "Chroma", "Splatter", "NeonMaster"];

        function setSkin(color, el) {
            playerColor = color;
            document.querySelectorAll('.skin-btn').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected');
        }

        function init() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050510);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 35, 25);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            const ambient = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambient);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
            dirLight.position.set(10, 40, 20);
            scene.add(dirLight);

            // 3D Zemin Arenası
            const floorGeo = new THREE.BoxGeometry(GRID_SIZE, 0.2, GRID_SIZE);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x101025, roughness: 0.5 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            scene.add(floor);

            // Oyuncu
            const pGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
            const pMat = new THREE.MeshStandardMaterial({ color: playerColor, emissive: playerColor, emissiveIntensity: 0.5 });
            playerMesh = new THREE.Mesh(pGeo, pMat);
            playerMesh.position.y = 0.5;
            scene.add(playerMesh);

            window.addEventListener('resize', onWindowResize);
            setupKeyboard();
        }

        function setupKeyboard() {
            window.addEventListener('keydown', (e) => {
                if(!isPlaying) return;
                if((e.key === 'ArrowUp' || e.key === 'w') && dirZ !== 1) changeDir(0, -1);
                if((e.key === 'ArrowDown' || e.key === 's') && dirZ !== -1) changeDir(0, 1);
                if((e.key === 'ArrowLeft' || e.key === 'a') && dirX !== 1) changeDir(-1, 0);
                if((e.key === 'ArrowRight' || e.key === 'd') && dirX !== -1) changeDir(1, 0);
            });
        }

        function changeDir(x, z) {
            dirX = x; dirZ = z;
        }

        function paintTile(x, z, color) {
            let key = `${x},${z}`;
            if(!grid[key]) {
                let geo = new THREE.PlaneGeometry(0.95, 0.95);
                let mat = new THREE.MeshBasicMaterial({ color: color });
                let mesh = new THREE.Mesh(geo, mat);
                mesh.rotation.x = -Math.PI / 2;
                mesh.position.set(x, 0.12, z);
                scene.add(mesh);
                grid[key] = { mesh: mesh, color: color };
            } else {
                grid[key].color = color;
                grid[key].mesh.material.color.setHex(color);
            }
        }

        function spawnBots() {
            bots = [];
            botNames.forEach((name) => {
                let color = Math.random() * 0xffffff;
                let bX = (Math.floor(Math.random() * 20) - 10);
                let bZ = (Math.floor(Math.random() * 20) - 10);
                bots.push({ name: name, x: bX, z: bZ, dirX: 1, dirZ: 0, color: color, area: Math.floor(Math.random() * 10) + 5 });
            });
        }

        function updateLeaderboard() {
            let all = [{ name: playerUser, area: coveredArea.toFixed(1), isPlayer: true }];
            bots.forEach(b => all.push({ name: b.name, area: b.area.toFixed(1), isPlayer: false }));
            all.sort((a, b) => b.area - a.area);

            let html = "";
            let rank = 1;
            all.forEach((p, idx) => {
                if(p.isPlayer) rank = idx + 1;
                if(idx < 4) {
                    let colorClass = p.isPlayer ? "text-cyan-400 font-bold" : "text-gray-300";
                    html += `<div class="flex justify-between ${colorClass}"><span>${idx+1}. ${p.name}</span><span>${p.area}%</span></div>`;
                }
            });
            document.getElementById("leaderboard-list").innerHTML = html;
            return rank;
        }

        function startGame() {
            initAudio();
            const nameInput = document.getElementById("username").value.trim();
            if(!nameInput) { alert("Lütfen adını gir!"); return; }

            playerUser = nameInput;
            playerMesh.material.color.setHex(playerColor);

            document.getElementById("menu-overlay").style.display = "none";
            document.getElementById("gameover-overlay").style.display = "none";
            document.getElementById("game-hud").style.display = "flex";
            document.getElementById("game-controls").style.display = "flex";

            pX = 0; pZ = 0; dirX = 1; dirZ = 0;
            trail = []; score = 0; coveredArea = 5.0;

            // Izgarayı Temizle
            Object.keys(grid).forEach(k => scene.remove(grid[k].mesh));
            grid = {};

            // Başlangıç Alanı Çiz
            for(let x = -2; x <= 2; x++) {
                for(let z = -2; z <= 2; z++) {
                    paintTile(x, z, playerColor);
                }
            }

            spawnBots();
            isPlaying = true;
        }

        function gameOver() {
            isPlaying = false;
            playSound('crash');
            let rank = updateLeaderboard();

            document.getElementById("game-hud").style.display = "none";
            document.getElementById("game-controls").style.display = "none";
            document.getElementById("gameover-overlay").style.display = "flex";
            document.getElementById("final-rank").innerText = `Arena Sıralaman: #${rank}`;
            document.getElementById("final-score").innerText = `Bölge Kaplama: ${coveredArea.toFixed(1)}%`;
        }

        function returnToMenu() {
            document.getElementById("gameover-overlay").style.display = "none";
            document.getElementById("menu-overlay").style.display = "flex";
        }

        let moveTimer = 0;
        function animate() {
            requestAnimationFrame(animate);

            if(isPlaying) {
                moveTimer++;
                if(moveTimer % 8 === 0) { // Hareket Hızı
                    pX += dirX;
                    pZ += dirZ;

                    // Sınır Kontrolü
                    if(Math.abs(pX) > 19 || Math.abs(pZ) > 19) {
                        gameOver();
                        return;
                    }

                    playerMesh.position.set(pX, 0.5, pZ);
                    camera.position.set(pX * 0.5, 30, pZ * 0.5 + 20);

                    let key = `${pX},${pZ}`;
                    // Eğer kendi güvenli alanında değilse iz bırak
                    if(!grid[key] || grid[key].color !== playerColor) {
                        paintTile(pX, pZ, playerColor);
                        trail.push({ x: pX, z: pZ });
                        coveredArea += 0.2;
                        score += 10;
                        playSound('paint');
                    } else if(trail.length > 0) {
                        // Kendi alanına geri döndü, bölgeyi kapat!
                        coveredArea += trail.length * 0.5;
                        trail = [];
                    }

                    // Bot Hareketleri
                    bots.forEach(b => {
                        if(Math.random() > 0.7) {
                            let dirs = [[1,0], [-1,0], [0,1], [0,-1]];
                            let d = dirs[Math.floor(Math.random()*4)];
                            b.dirX = d[0]; b.dirZ = d[1];
                        }
                        b.x += b.dirX; b.z += b.dirZ;
                        if(Math.abs(b.x) < 19 && Math.abs(b.z) < 19) {
                            paintTile(b.x, b.z, b.color);
                        }
                    });

                    document.getElementById("area-text").innerText = coveredArea.toFixed(1) + "%";
                    document.getElementById("score-text").innerText = score;
                    updateLeaderboard();
                }
            }

            renderer.render(scene, camera);
        }

        init();
        animate();

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
