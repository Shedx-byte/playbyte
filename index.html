<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlayByte - Cyber Quest Elite</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #05050f;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            overflow: hidden;
            touch-action: none;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 5px;
        }
        header {
            padding: 5px;
        }
        h1 {
            color: #00ffcc;
            font-size: 18px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0,255,204,0.6);
        }
        .stats-bar {
            display: flex;
            justify-content: space-around;
            font-size: 12px;
            color: #a0a0c0;
            margin-top: 2px;
        }
        .stats-bar span {
            color: #ff007f;
            font-weight: bold;
        }
        .main-layout {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-grow: 1;
        }
        /* Sol Taraf Market Paneli */
        .side-market {
            width: 90px;
            background: #101026;
            border: 1px solid #00ffcc;
            border-radius: 8px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 0 12px rgba(0,255,204,0.2);
        }
        .side-market h3 {
            font-size: 10px;
            color: #00ffcc;
            margin-bottom: 2px;
        }
        .market-btn {
            background: linear-gradient(45deg, #ff007f, #7f00ff);
            color: #fff;
            border: none;
            padding: 6px 2px;
            font-size: 9px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(255,0,127,0.3);
        }
        .market-btn:active {
            transform: scale(0.95);
        }
        #gameCanvas {
            background: radial-gradient(circle at center, #151530 0%, #030308 100%);
            display: block;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
            border-radius: 8px;
            border: 1px solid #222244;
        }
        .hud-panel {
            padding: 6px;
            background: #101026;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-radius: 8px;
        }
        .btn {
            background: linear-gradient(45deg, #00ffcc, #0077ff);
            color: #000;
            border: none;
            padding: 8px 14px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0,255,204,0.4);
        }
        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <header>
        <h1>⚡ CYBER QUEST ELITE</h1>
        <div class="stats-bar">
            <div>SKOR: <span id="scoreVal">0</span></div>
            <div>💎 <span id="coinVal">0</span></div>
            <div>CAN: <span id="lifeVal">❤️❤️❤️</span></div>
        </div>
    </header>

    <div class="main-layout">
        <!-- SOLDA MARKET PANELI -->
        <div class="side-market">
            <h3>MARKET</h3>
            <button class="market-btn" onclick="buyUpgrade('doubleLaser')">Çift Lazer<br>(15 💎)</button>
            <button class="market-btn" onclick="buyUpgrade('shield')">Kalkan<br>(25 💎)</button>
            <button class="market-btn" onclick="buyUpgrade('speed')">Hız<br>(10 💎)</button>
        </div>

        <canvas id="gameCanvas" width="260" height="400"></canvas>
    </div>

    <div class="hud-panel">
        <button class="btn" onclick="togglePause()">DURDUR / DEVAM</button>
        <button class="btn" style="background: linear-gradient(45deg, #ff007f, #ffaa00);" onclick="resetGame()">YENİDEN</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const scoreVal = document.getElementById("scoreVal");
        const coinVal = document.getElementById("coinVal");
        const lifeVal = document.getElementById("lifeVal");

        let score = 0;
        let coins = 0;
        let lives = 3;
        let isPaused = false;
        let gameOver = false;
        let gameStarted = false;
        let level = 1;

        let hasDoubleLaser = false;
        let hasShield = false;
        let speedLevel = 1;

        let bossActive = false;
        let boss = { x: 80, y: -80, w: 90, h: 45, hp: 60, maxHp: 60, dir: 2 };

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'laser') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.start(); osc.stop(audioCtx.currentTime + 0.08);
            } else if (type === 'explosion') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(140, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(20, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            }
        }

        let player = {
            x: canvas.width / 2,
            y: canvas.height - 45,
            w: 32,
            h: 36,
            speed: 5
        };

        let bullets = [];
        let enemies = [];
        let particles = [];
        let floatingTexts = [];
        let stars = [];

        for (let i = 0; i < 40; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 1.5 + 0.5,
                speed: Math.random() * 1 + 0.5
            });
        }

        let touchX = player.x;
        let isTouching = false;

        canvas.addEventListener("pointerdown", (e) => {
            isTouching = true;
            updateTouchPos(e);
            if (!gameStarted || gameOver) resetGame();
        });
        canvas.addEventListener("pointermove", (e) => { if (isTouching) updateTouchPos(e); });
        canvas.addEventListener("pointerup", () => { isTouching = false; });

        function updateTouchPos(e) {
            const rect = canvas.getBoundingClientRect();
            touchX = e.clientX - rect.left;
        }

        let keys = {};
        window.addEventListener("keydown", (e) => { keys[e.code] = true; if(e.code === "Space" && (!gameStarted || gameOver)) resetGame(); });
        window.addEventListener("keyup", (e) => { keys[e.code] = false; });

        function resetGame() {
            score = 0;
            coins = 0;
            lives = 3;
            level = 1;
            bullets = [];
            enemies = [];
            particles = [];
            bossActive = false;
            gameOver = false;
            gameStarted = true;
        }

        function togglePause() {
            if (gameStarted && !gameOver) isPaused = !isPaused;
        }

        function buyUpgrade(item) {
            if (item === 'doubleLaser' && coins >= 15 && !hasDoubleLaser) {
                coins -= 15; hasDoubleLaser = true;
            } else if (item === 'shield' && coins >= 25 && !hasShield) {
                coins -= 25; hasShield = true;
            } else if (item === 'speed' && coins >= 10 && speedLevel < 3) {
                coins -= 10; speedLevel++; player.speed += 1.5;
            }
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x, y, vx: (Math.random() - 0.5) * 4, vy: (Math.random() - 0.5) * 4,
                    radius: Math.random() * 2.5 + 1, color, alpha: 1
                });
            }
        }

        function addFloatingText(text, x, y, color) {
            floatingTexts.push({ text, x, y, alpha: 1, color });
        }

        let frameCount = 0;
        function update() {
            if (!gameStarted || isPaused || gameOver) return;

            frameCount++;
            level = Math.floor(score / 80) + 1;

            if (score > 0 && score % 100 === 0 && !bossActive) {
                bossActive = true;
                boss.hp = 50 + level * 15;
                boss.maxHp = boss.hp;
                boss.y = -50;
            }

            stars.forEach(star => {
                star.y += star.speed;
                if (star.y > canvas.height) star.y = 0;
            });

            if (isTouching) {
                let dx = touchX - player.x;
                player.x += dx * 0.25;
            }
            if (keys["ArrowLeft"] || keys["KeyA"]) player.x -= player.speed;
            if (keys["ArrowRight"] || keys["KeyD"]) player.x += player.speed;

            if (player.x < player.w / 2) player.x = player.w / 2;
            if (player.x > canvas.width - player.w / 2) player.x = canvas.width - player.w / 2;

            // Akıcı ve uzun neon lazer huzmeleri
            if (frameCount % 12 === 0) {
                if (hasDoubleLaser) {
                    bullets.push({ x: player.x - 8, y: player.y - 15, w: 4, h: 22, speed: 12 });
                    bullets.push({ x: player.x + 8, y: player.y - 15, w: 4, h: 22, speed: 12 });
                } else {
                    bullets.push({ x: player.x, y: player.y - 15, w: 5, h: 24, speed: 12 });
                }
                playSound('laser');
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.y -= b.speed;
                if (b.y < 0) bullets.splice(i, 1);
            }

            if (bossActive) {
                if (boss.y < 35) boss.y += 1;
                boss.x += boss.dir;
                if (boss.x < 20 || boss.x > canvas.width - 110) boss.dir *= -1;

                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j];
                    if (b.x > boss.x && b.x < boss.x + boss.w && b.y > boss.y && b.y < boss.y + boss.h) {
                        boss.hp--;
                        bullets.splice(j, 1);
                        createExplosion(b.x, b.y, '#ff007f');
                        if (boss.hp <= 0) {
                            bossActive = false;
                            score += 100;
                            coins += 15;
                            playSound('explosion');
                            addFloatingText("+100 BOSS", boss.x, boss.y, '#00ffcc');
                        }
                    }
                }
            } else {
                if (frameCount % Math.max(28, 60 - level * 4) === 0) {
                    enemies.push({ x: Math.random() * (canvas.width - 28), y: -30, w: 28, h: 28, speed: 1.8 + level * 0.2 });
                }

                for (let i = enemies.length - 1; i >= 0; i--) {
                    let e = enemies[i];
                    e.y += e.speed;

                    let dist = Math.hypot(player.x - (e.x + e.w/2), player.y - (e.y + e.h/2));
                    if (dist < player.w / 2 + e.w / 2) {
                        if (hasShield) { hasShield = false; addFloatingText("KALKAN!", player.x, player.y - 15, '#ffaa00'); }
                        else { lives--; }
                        createExplosion(e.x, e.y, '#ff0000');
                        playSound('explosion');
                        enemies.splice(i, 1);
                        if (lives <= 0) gameOver = true;
                        continue;
                    }

                    if (e.y > canvas.height) { enemies.splice(i, 1); continue; }

                    for (let j = bullets.length - 1; j >= 0; j--) {
                        let b = bullets[j];
                        if (b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h) {
                            bullets.splice(j, 1);
                            coins += Math.random() < 0.45 ? 1 : 0;
                            score += 10;
                            playSound('explosion');
                            createExplosion(e.x, e.y, '#ff007f');
                            addFloatingText("+10", e.x, e.y, '#00ffcc');
                            enemies.splice(i, 1);
                            break;
                        }
                    }
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.alpha -= 0.04;
                if (p.alpha <= 0) particles.splice(i, 1);
            }

            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                let ft = floatingTexts[i];
                ft.y -= 1; ft.alpha -= 0.02;
                if (ft.alpha <= 0) floatingTexts.splice(i, 1);
            }

            scoreVal.innerText = score;
            coinVal.innerText = coins;
            lifeVal.innerText = "❤️".repeat(Math.max(0, lives));
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#ffffff";
            stars.forEach(star => {
                ctx.globalAlpha = star.size / 2;
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });
            ctx.globalAlpha = 1;

            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            });

            floatingTexts.forEach(ft => {
                ctx.save();
                ctx.globalAlpha = ft.alpha;
                ctx.fillStyle = ft.color;
                ctx.font = "bold 12px Arial";
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.restore();
            });

            if (!gameStarted) {
                ctx.fillStyle = "rgba(5, 5, 15, 0.9)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#00ffcc";
                ctx.font = "bold 18px Arial";
                ctx.textAlign = "center";
                ctx.fillText("CYBER QUEST", canvas.width / 2, canvas.height / 2 - 25);
                ctx.fillStyle = "#ffffff";
                ctx.font = "12px Arial";
                ctx.fillText("Başlamak İçin Dokun", canvas.width / 2, canvas.height / 2 + 15);
                ctx.textAlign = "left";
                return;
            }

            // BOSS Çizimi
            if (bossActive) {
                ctx.fillStyle = "#ff007f";
                ctx.fillRect(boss.x, boss.y, boss.w, boss.h);
                ctx.fillStyle = "#333";
                ctx.fillRect(boss.x, boss.y - 8, boss.w, 5);
                ctx.fillStyle = "#00ffcc";
                ctx.fillRect(boss.x, boss.y - 8, boss.w * (boss.hp / boss.maxHp), 5);
            }

            // Parlayan Akıcı Neon Lazerler
            ctx.shadowBlur = 8;
            ctx.shadowColor = "#00ffcc";
            ctx.fillStyle = "#00ffcc";
            bullets.forEach(b => {
                ctx.fillRect(b.x - b.w/2, b.y, b.w, b.h);
            });

            // Gelişmiş Detaylı Uzay Gemisi
            ctx.shadowColor = hasDoubleLaser ? "#ff00ff" : "#00ffcc";
            ctx.fillStyle = hasDoubleLaser ? "#ff00ff" : "#00ffcc";
            ctx.beginPath();
            ctx.moveTo(player.x, player.y - player.h/2);
            ctx.lineTo(player.x - player.w/2, player.y + player.h/2);
            ctx.lineTo(player.x, player.y + player.h/4);
            ctx.lineTo(player.x + player.w/2, player.y + player.h/2);
            ctx.closePath();
            ctx.fill();

            // Motor Alevi Efekti
            ctx.fillStyle = "#ffaa00";
            ctx.fillRect(player.x - 3, player.y + player.h/2, 6, 8);

            // Kalkan Halkası
            if (hasShield) {
                ctx.strokeStyle = "#00aaff";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(player.x, player.y, player.w * 0.8, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Detaylı Düşman Gemileri (Bloklar Yerine)
            ctx.shadowColor = "#ff007f";
            enemies.forEach(e => {
                ctx.fillStyle = "#ff007f";
                ctx.fillRect(e.x, e.y, e.w, e.h);
                // Düşman kokpiti
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(e.x + 8, e.y + 8, 12, 12);
            });
            ctx.shadowBlur = 0;

            if (gameOver) {
                ctx.fillStyle = "rgba(3, 3, 8, 0.95)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ff007f";
                ctx.font = "bold 22px Arial";
                ctx.textAlign = "center";
                ctx.fillText("OYUN BİTTİ", canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = "#ffffff";
                ctx.font = "14px Arial";
                ctx.fillText("Skor: " + score, canvas.width / 2, canvas.height / 2 + 10);
                ctx.fillText("Tekrar İçin Dokun", canvas.width / 2, canvas.height / 2 + 35);
                ctx.textAlign = "left";
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
