<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VoidSlide 3D - Ultra Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #010105; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; touch-action: none; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .hud { position: absolute; z-index: 10; color: #fff; pointer-events: none; }
        .btn-cyber { background: linear-gradient(135deg, #00f0ff, #7928ca); border: 2px solid #00f0ff; color: #000; font-weight: 900; padding: 16px 32px; border-radius: 40px; box-shadow: 0 0 25px rgba(0,240,255,0.6); cursor: pointer; pointer-events: auto; transition: transform 0.1s, box-shadow 0.1s; text-transform: uppercase; letter-spacing: 2px; }
        .btn-cyber:active { transform: scale(0.95); box-shadow: 0 0 10px rgba(0,240,255,0.8); }
        .cyber-input { background: rgba(5, 5, 20, 0.9); border: 2px solid #00f0ff; border-radius: 30px; padding: 14px 24px; color: #fff; text-align: center; font-weight: bold; outline: none; box-shadow: 0 0 15px rgba(0,240,255,0.3); }
        .cyber-panel { background: rgba(5, 5, 20, 0.85); border: 2px solid rgba(0,240,255,0.4); backdrop-filter: blur(10px); border-radius: 20px; box-shadow: 0 0 30px rgba(0,240,255,0.2); }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- ANA MENÜ -->
    <div id="menu-overlay" class="absolute inset-0 z-30 flex flex-col items-center justify-center bg-black/85 px-4">
        <div class="cyber-panel p-8 max-w-sm w-full text-center flex flex-col items-center">
            <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-purple-500 to-pink-500 mb-2 tracking-widest drop-shadow-[0_0_20px_rgba(0,240,255,0.8)]">VOID SLIDE</h1>
            <p class="text-xs text-cyan-300 font-mono mb-6 uppercase tracking-widest">Ultra Neon Arcade</p>

            <input type="text" id="username" placeholder="OYUNCU ADI" class="cyber-input w-full mb-4 text-sm" maxlength="12">

            <div class="w-full bg-cyan-950/40 border border-cyan-500/30 rounded-xl p-3 mb-6 text-xs text-cyan-200">
                👑 REKOR: <span id="high-score-val" class="font-bold text-white text-sm">0</span> (<span id="high-score-user">YOK</span>)
            </div>

            <button class="btn-cyber w-full text-base" onclick="startGame()">OYUNA BAŞLA 🚀</button>
        </div>
    </div>

    <!-- OYUN HUD -->
    <div id="game-hud" class="hud top-6 left-6 right-6 flex justify-between items-center" style="display:none;">
        <div class="cyber-panel px-5 py-2 font-mono text-cyan-400 text-lg font-black flex gap-6">
            <div>SKOR: <span id="score-text" class="text-white">0</span></div>
            <div>KRİSTAL: <span id="crystal-text" class="text-yellow-400">0</span></div>
        </div>
        <div class="cyber-panel px-5 py-2 font-mono text-pink-500 text-lg font-black">
            HIZ: <span id="speed-text" class="text-white">100</span>
        </div>
    </div>

    <!-- OYUN BİTTİ EKRANI -->
    <div id="gameover-overlay" class="absolute inset-0 z-40 flex flex-col items-center justify-center bg-black/95 px-4" style="display:none;">
        <div class="cyber-panel p-8 max-w-sm w-full text-center flex flex-col items-center border-red-500/60 shadow-[0_0_40px_rgba(255,0,85,0.3)]">
            <h2 class="text-3xl font-black text-red-500 mb-2 tracking-wider drop-shadow-[0_0_10px_#ff0055]">SİSTEM ÇÖKTÜ</h2>
            <p id="final-score" class="text-gray-300 text-sm mb-6 font-mono">SKORUN: 0</p>
            <button class="btn-cyber w-full text-base bg-gradient-to-r from-red-500 to-pink-600 border-red-400 shadow-[0_0_20px_rgba(255,0,85,0.6)]" onclick="returnToMenu()">TEKRAR DENE</button>
        </div>
    </div>

    <script>
        // Web Audio API Ses Motoru (Hata vermez, harici dosya istemez)
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        function playSound(type) {
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            let now = audioCtx.currentTime;
            if (type === 'collect') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, now); // D5
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.15); // A5
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'crash') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(40, now + 0.4);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'start') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.2);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            }
        }

        let scene, camera, renderer, tunnel, playerMesh;
        let angle = 0, speed = 0.9, score = 0, crystalsCount = 0, isPlaying = false;
        let obstacles = [], crystals = [], particles = [];
        let playerUser = "Racer", highScore = parseInt(localStorage.getItem("vs_ultra_score")||"0"), highScoreUser = localStorage.getItem("vs_ultra_user")||"YOK";
        let shakeDuration = 0, shakeIntensity = 0;

        document.getElementById("high-score-val").innerText = highScore;
        document.getElementById("high-score-user").innerText = highScoreUser;

        function init() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x010105, 0.012);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Neon Tünel
            const tunnelGeo = new THREE.CylinderGeometry(9, 9, 400, 32, 1, true);
            const tunnelMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, wireframe: true, transparent: true, opacity: 0.25 });
            tunnel = new THREE.Mesh(tunnelGeo, tunnelMat);
            tunnel.rotation.x = Math.PI / 2;
            scene.add(tunnel);

            // Oyuncu Gemisi / Küpü
            const pGeo = new THREE.BoxGeometry(0.9, 0.9, 1.2);
            const pMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
            playerMesh = new THREE.Mesh(pGeo, pMat);
            scene.add(playerMesh);

            // Ambient & Point Işıklar
            const ambient = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambient);

            window.addEventListener('resize', onWindowResize);
            setupControls();
        }

        // Kontroller (Klavye ve Dokunmatik)
        let touchStartX = 0;
        function setupControls() {
            window.addEventListener('keydown', (e) => {
                if(!isPlaying) return;
                if(e.key === 'ArrowLeft' || e.key === 'a') angle -= 0.15;
                if(e.key === 'ArrowRight' || e.key === 'd') angle += 0.15;
            });

            window.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; });
            window.addEventListener('touchmove', (e) => {
                if(!isPlaying) return;
                let diff = e.touches[0].clientX - touchStartX;
                angle += diff * 0.0035;
                touchStartX = e.touches[0].clientX;
            });
        }

        function spawnObstacle() {
            const obsGeo = new THREE.BoxGeometry(2.2, 2.2, 2.2);
            const obsMat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
            const obs = new THREE.Mesh(obsGeo, obsMat);
            
            let obsAngle = Math.random() * Math.PI * 2;
            let radius = 8.1;
            obs.position.x = Math.cos(obsAngle) * radius;
            obs.position.y = Math.sin(obsAngle) * radius;
            obs.position.z = camera.position.z - 250;
            scene.add(obs);
            obstacles.push(obs);
        }

        function spawnCrystal() {
            const cryGeo = new THREE.OctahedronGeometry(0.6);
            const cryMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
            const cry = new THREE.Mesh(cryGeo, cryMat);
            
            let cryAngle = Math.random() * Math.PI * 2;
            let radius = 8.1;
            cry.position.x = Math.cos(cryAngle) * radius;
            cry.position.y = Math.sin(cryAngle) * radius;
            cry.position.z = camera.position.z - 250;
            scene.add(cry);
            crystals.push(cry);
        }

        function createExplosion(x, y, z, colorHex) {
            for(let i = 0; i < 20; i++) {
                let pGeo = new THREE.BoxGeometry(0.3, 0.3, 0.3);
                let pMat = new THREE.MeshBasicMaterial({ color: colorHex });
                let particle = new THREE.Mesh(pGeo, pMat);
                particle.position.set(x, y, z);
                
                let velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.5,
                    (Math.random() - 0.5) * 0.5,
                    (Math.random() - 0.5) * 0.5 - 0.2
                );
                scene.add(particle);
                particles.push({ mesh: particle, velocity: velocity, life: 30 });
            }
        }

        function startGame() {
            initAudio();
            const nameInput = document.getElementById("username").value.trim();
            if(!nameInput) { alert("Lütfen oyuncu adını gir!"); return; }

            playerUser = nameInput;
            playSound('start');
            document.getElementById("menu-overlay").style.display = "none";
            document.getElementById("gameover-overlay").style.display = "none";
            document.getElementById("game-hud").style.display = "flex";

            score = 0; crystalsCount = 0; speed = 0.9; angle = 0;
            obstacles.forEach(o => scene.remove(o));
            crystals.forEach(c => scene.remove(c));
            obstacles = []; crystals = [];
            isPlaying = true;
        }

        function gameOver() {
            isPlaying = false;
            playSound('crash');
            shakeDuration = 25; shakeIntensity = 0.5;
            createExplosion(playerMesh.position.x, playerMesh.position.y, playerMesh.position.z, 0x00ffff);

            document.getElementById("game-hud").style.display = "none";
            document.getElementById("gameover-overlay").style.display = "flex";
            document.getElementById("final-score").innerText = `${playerUser} | Skor: ${Math.floor(score)} | Kristal: ${crystalsCount}`;

            if(score > highScore) {
                highScore = Math.floor(score);
                highScoreUser = playerUser;
                localStorage.setItem("vs_ultra_score", highScore);
                localStorage.setItem("vs_ultra_user", highScoreUser);
            }
        }

        function returnToMenu() {
            document.getElementById("gameover-overlay").style.display = "none";
            document.getElementById("menu-overlay").style.display = "flex";
            document.getElementById("high-score-val").innerText = highScore;
            document.getElementById("high-score-user").innerText = highScoreUser;
        }

        let frameCount = 0;
        function animate() {
            requestAnimationFrame(animate);

            if(isPlaying) {
                frameCount++;
                score += speed * 1.5;
                speed += 0.0004; // Hız artışı

                document.getElementById("score-text").innerText = Math.floor(score);
                document.getElementById("crystal-text").innerText = crystalsCount;
                document.getElementById("speed-text").innerText = Math.floor(speed * 110);

                // Oyuncu Pozisyonu
                let radius = 8.1;
                playerMesh.position.x = Math.cos(angle) * radius;
                playerMesh.position.y = Math.sin(angle) * radius;
                playerMesh.position.z = camera.position.z - 12;
                playerMesh.rotation.z = angle;
                playerMesh.rotation.x += 0.05;

                // Kamera Takibi & Ekran Sarsıntısı
                let camX = playerMesh.position.x * 0.3;
                let camY = playerMesh.position.y * 0.3;
                let camZ = playerMesh.position.z + 14;
                if(shakeDuration > 0) {
                    camX += (Math.random() - 0.5) * shakeIntensity;
                    camY += (Math.random() - 0.5) * shakeIntensity;
                    shakeDuration--;
                }
                camera.position.set(camX, camY, camZ);
                camera.lookAt(playerMesh.position.x, playerMesh.position.y, playerMesh.position.z - 10);

                // Tünel Akışı
                tunnel.position.z += speed;
                if(tunnel.position.z > 60) tunnel.position.z = 0;

                // Nesne Üretimi
                if(frameCount % Math.max(12, Math.floor(35 - speed * 8)) === 0) {
                    spawnObstacle();
                    if(Math.random() > 0.4) spawnCrystal();
                }

                // Engelleri Yönetme ve Çarpışma
                for(let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    obs.position.z += speed * 2;
                    obs.rotation.x += 0.02;

                    if(playerMesh.position.distanceTo(obs.position) < 1.7) {
                        gameOver();
                        break;
                    }

                    if(obs.position.z > camera.position.z + 10) {
                        scene.remove(obs);
                        obstacles.splice(i, 1);
                    }
                }

                // Kristalleri Yönetme
                for(let i = crystals.length - 1; i >= 0; i--) {
                    let cry = crystals[i];
                    cry.position.z += speed * 2;
                    cry.rotation.y += 0.08;

                    if(playerMesh.position.distanceTo(cry.position) < 1.6) {
                        playSound('collect');
                        crystalsCount++;
                        score += 150;
                        createExplosion(cry.position.x, cry.position.y, cry.position.z, 0xffaa00);
                        scene.remove(cry);
                        crystals.splice(i, 1);
                        continue;
                    }

                    if(cry.position.z > camera.position.z + 10) {
                        scene.remove(cry);
                        crystals.splice(i, 1);
                    }
                }
            }

            // Parçacık Animasyonları
            for(let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.mesh.position.add(p.velocity);
                p.life--;
                p.mesh.scale.multiplyScalar(0.95);
                if(p.life <= 0) {
                    scene.remove(p.mesh);
                    particles.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        init();
        animate();

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
