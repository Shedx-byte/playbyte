<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayByte - Mini Games</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 15px;
        }
        h1 {
            color: #00ffcc;
            margin-bottom: 5px;
            font-size: 28px;
        }
        p.subtitle {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .game-container {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 15px;
            max-width: 360px;
            margin: 0 auto;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
        }
        canvas {
            background-color: #70c5ce;
            border-radius: 8px;
            display: block;
            margin: 0 auto;
            touch-action: manipulation;
        }
        .controls {
            margin-top: 12px;
        }
        button {
            background-color: #00ffcc;
            color: #121212;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
