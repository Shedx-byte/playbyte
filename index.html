<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TimeShatter.io - Temporal Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #020208; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; touch-action: none; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .hud { position: absolute; z-index: 10; color: #fff; pointer-events: none; }
        .btn-io { background: linear-gradient(135deg, #a855f7, #ec4899); border: 2px solid #d946ef; color: #fff; font-weight: 900; padding: 16px 32px; border-radius: 40px; box-shadow: 0 0 25px rgba(217,70,239,0.6); cursor: pointer; pointer-events: auto; transition: transform 0.1s; text-transform: uppercase; letter-spacing: 2px; }
        .btn-io:active { transform: scale(0.95); }
        .io-input { background: rgba(10, 5, 20, 0.9); border: 2px solid #d946ef; border-radius: 30px; padding: 14px 24px; color: #fff; text-align: center; font-weight: bold; outline: none; box-shadow: 0 0 15px rgba(217,70,239,0.3); }
        .io-panel { background: rgba(10, 5, 20, 0.9); border: 2px solid rgba(217,70,239,0.4); backdrop-filter: blur(12px); border-radius: 20px; box-shadow: 0 0 30px rgba(217,70,239,0.2); }
        .skin-btn { width: 35px; height: 35px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; pointer-events: auto; transition: transform 0.2s; }
        .skin-btn.selected { transform: scale(1.25); border-color: #d946ef; box-shadow: 0 0 15px #d946ef; }
        .control-btn { background: rgba(217, 70, 239, 0.2); border: 2px solid #d946ef; color: #d946ef; font-size: 24px; font-weight: bold; width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; justify-content: center; pointer-events: auto; cursor: pointer; user-select: none; box-shadow: 0 0 15px rgba(217,70,239,0.3); }
        .control-btn:active { background: rgba(217, 70, 239, 0.5); transform: scale(0.9); }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- ANA MENÜ -->
    <div id="menu-overlay" class="absolute inset-0 z-30 flex flex-col items-center justify-center bg-black/90 px-4">
        <div class="io-panel p-8 max-w-sm w-full text-center flex flex-col items-center">
            <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-pink-500 to-red-500 mb-1 tracking-widest drop-shadow-[0_0_20px_rgba(217,70,239,0.8)]">TIMESHATTER<span class="text-purple-400">.IO</span></h1>
            <p class="text-xs text-purple-300 font-mono mb-6 uppercase tracking-widest">Geçmişinle Yüzleş</p>

            <input type="text" id="username" placeholder="OYUNCU ADI" class="io-input w-full mb-4 text-sm" maxlength="12">

            <!-- Renk / Skin Seçimi -->
            <div class="mb-6 w-full">
                <p class="text-xs text-gray-400 mb-2 font-mono">ZAMAN ENERJİSİ</p>
                <div class="flex justify-center gap-4">
                    <div class="skin-btn selected" style="background:#a855f7;" onclick="setSkin(0xa855f7, this)"></div>
                    <div class="skin-btn" style="background:#06b6d4;" onclick="setSkin(0x06b6d4, this)"></div>
                    <div class="skin-btn" style="background:#10b981;" onclick="setSkin(0x10b981, this)"></div>
                    <div class="skin-btn" style="background:#f59e0b;" onclick="setSkin(0xf59e0b, this)"></div>
                </div>
            </div>

            <button class="btn-io w-full text-base" onclick="startGame()">ZAMANI BAŞLAT ⏳</button>
        </div>
    </div>

    <!-- OYUN HUD & LİDERLİK TABLOSU -->
    <div id="game-hud" class="hud top-4 left-4 right-4 flex justify-between items-start" style="display:none;">
        <div class="io-panel px-4 py-2 font-mono text-purple-400 text-sm font-black flex flex-col gap-1">
            <div>SKOR: <span id="score-text" class="text-white text-base">0</span></div>
            <div>DÖNGÜ: <span id="loop-text" class="text-pink-400">1</span></div>
        </div>

        <!-- Canlı Liderlik Tablosu -->
        <div class="io-panel px-4 py-3 font-mono text-xs text-white min-w-[160px]">
            <div class="text-purple-400 font-bold mb-2 border-b border-purple-500/30 pb-1">🏆 ZAMAN LİDERLERİ</div>
            <div id="leaderboard-list" class="flex flex-col gap-1 text-gray-300"></div>
        </div>
    </div>

    <!-- MOBİL KONTROL BUTONLARI -->
    <div id="game-controls" class="hud bottom-6 left-6 right-6 flex justify-between items-end" style="display:none;">
        <div class="flex gap-3">
            <div class="control-btn" ontouchstart="movePlayer(-1)" onmousedown="movePlayer(-1)">◀</div>
            <div class="control-btn" ontouchstart="movePlayer(1)" onmousedown="movePlayer(1)">▶</div>
        </div>
        <div class="control-btn" style="width:90px; height:90px; background:rgba(236,72,153,0.3); border-color:#ec4899; color:#ec4899;" ontouchstart="jumpPlayer()" onmousedown="jumpPlayer()">🌀</div>
    </div>

    <!-- OYUN BİTTİ EKRANI -->
    <div id="gameover-overlay" class="absolute inset-0 z-40 flex flex-col items-center justify-center bg-black/95 px-4" style="display:none;">
        <div class="io-panel p-8 max-w-sm w-full text-center flex flex-col items-center border-purple-500/60 shadow-[0_0_40px_rgba(217,70,239,0.3)]">
            <h2 class="text-3xl font-black text-purple-400 mb-1 tracking-wider drop-shadow-[0_0_10px_#d946ef]">PARÇALANDIN</h2>
            <p id="final-rank" class="text-pink-400 font-bold text-sm mb-2 font-mono">Sıralama: #1</p>
            <p id="final-score" class="text-gray-300 text-sm mb-6 font-mono">Skor: 0</p>
            <button class="btn-io w-full text-base" onclick="returnToMenu()">TEKRAR DENE</button>
        </div>
    </div>

    <script>
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        function playSound(type) {
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            let now = audioCtx.currentTime;

            if (type === 'jump') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.linearRampToValueAtTime(600, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'clone') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.3);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'crash') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.linearRampToValueAtTime(30, now + 0.4);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now); osc.stop(now + 0.4);
            }
        }

        let scene, camera, renderer, playerGroup;
        let score = 0, loopCount = 1, isPlaying = false;
        let obstacles = [], clones = [], bots = [], pathHistory = [];
        let playerColor = 0xa855f7;
        let playerUser = "Racer";
        let playerLane = 0, targetX = 0;
        let playerYVelocity = 0, isJumping = false;
        let gameSpeed = 0.5;
        let cloneTimer = 0;

        const botNames = ["Chronos", "Paradox", "Vector", "Eon", "Nexus"];

        function setSkin(color, el) {
            playerColor = color;
            document.querySelectorAll('.skin-btn').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected');
        }

        function init() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020208);
            scene.fog = new THREE.FogExp2(0x020208, 0.015);

            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);
            camera.lookAt(0, 1, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            const ambient = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambient);
            const dirLight = new THREE.DirectionalLight(0xd946ef, 1);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            // Zemin
            const floorGeo = new THREE.PlaneGeometry(12, 600);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x0f051d, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.z = -250;
            scene.add(floor);

            createPlayer();
            window.addEventListener('resize', onWindowResize);
            setupKeyboard();
        }

        function createPlayer() {
            playerGroup = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: playerColor, emissive: playerColor, emissiveIntensity: 0.3 });
            const body = new THREE.Mesh(new THREE.BoxGeometry(1, 1.2, 0.6), mat);
            body.position.y = 0.6;
            playerGroup.add(body);
            scene.add(playerGroup);
        }

        function setupKeyboard() {
            window.addEventListener('keydown', (e) => {
                if(!isPlaying) return;
                if(e.key === 'ArrowLeft' || e.key === 'a') movePlayer(-1);
                if(e.key === 'ArrowRight' || e.key === 'd') movePlayer(1);
                if(e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') jumpPlayer();
            });
        }

        function movePlayer(dir) {
            playerLane += dir;
            if(playerLane < -1) playerLane = -1;
            if(playerLane > 1) playerLane = 1;
            targetX = playerLane * 3.5;
            playSound('jump');
        }

        function jumpPlayer() {
            if(!isJumping) {
                isJumping = true;
                playerYVelocity = 0.35;
                playSound('jump');
            }
        }

        function spawnObstacle() {
            const obsGeo = new THREE.BoxGeometry(2.5, 1.2, 1.2);
            const obsMat = new THREE.MeshStandardMaterial({ color: 0xec4899, emissive: 0xec4899, emissiveIntensity: 0.5 });
            const obs = new THREE.Mesh(obsGeo, obsMat);
            let lane = Math.floor(Math.random() * 3) - 1;
            obs.position.set(lane * 3.5, 0.6, -150);
            scene.add(obs);
            obstacles.push(obs);
        }

        function spawnBots() {
            botNames.forEach((name, idx) => {
                let bMat = new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff });
                let mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1.2, 0.6), bMat);
                let lane = (idx % 3) - 1;
                mesh.position.set(lane * 3.5, 0.6, -50 - (idx * 25));
                scene.add(mesh);
                bots.push({ name: name, mesh: mesh, score: Math.floor(Math.random() * 200) });
            });
        }

        function spawnClone(recordedPath) {
            playSound('clone');
            let cloneMat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.5, emissive: 0xd946ef });
            let cloneMesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1.2, 0.6), cloneMat);
            scene.add(cloneMesh);
            clones.push({ mesh: cloneMesh, path: [...recordedPath], index: 0 });
            loopCount++;
        }

        function updateLeaderboard() {
            let allPlayers = [{ name: playerUser, score: Math.floor(score), isPlayer: true }];
            bots.forEach(b => allPlayers.push({ name: b.name, score: b.score, isPlayer: false }));
            allPlayers.sort((a, b) => b.score - a.score);

            let listHtml = "";
            let playerRank = 1;
            allPlayers.forEach((p, idx) => {
                if(p.isPlayer) playerRank = idx + 1;
                if(idx < 4) {
                    let colorClass = p.isPlayer ? "text-purple-400 font-bold" : "text-gray-300";
                    listHtml += `<div class="flex justify-between ${colorClass}"><span>${idx+1}. ${p.name}</span><span>${p.score}</span></div>`;
                }
            });
            document.getElementById("leaderboard-list").innerHTML = listHtml;
            return playerRank;
        }

        function startGame() {
            initAudio();
            const nameInput = document.getElementById("username").value.trim();
            if(!nameInput) { alert("Lütfen oyuncu adını gir!"); return; }

            playerUser = nameInput;
            playerGroup.children[0].material.color.setHex(playerColor);

            document.getElementById("menu-overlay").style.display = "none";
            document.getElementById("gameover-overlay").style.display = "none";
            document.getElementById("game-hud").style.display = "flex";
            document.getElementById("game-controls").style.display = "flex";

            score = 0; loopCount = 1; gameSpeed = 0.6; playerLane = 0; targetX = 0; cloneTimer = 0;
            pathHistory = [];

            obstacles.forEach(o => scene.remove(o));
            clones.forEach(c => scene.remove(c.mesh));
            bots.export = bots.forEach(b => scene.remove(b.mesh));
            obstacles = []; clones = []; bots = [];

            spawnBots();
            isPlaying = true;
        }

        function gameOver() {
            isPlaying = false;
            playSound('crash');
            let rank = updateLeaderboard();

            document.getElementById("game-hud").style.display = "none";
            document.getElementById("game-controls").style.display = "none";
            document.getElementById("gameover-overlay").style.display = "flex";
            document.getElementById("final-rank").innerText = `Zaman Sıralaman: #${rank}`;
            document.getElementById("final-score").innerText = `Toplam Skor: ${Math.floor(score)}`;
        }

        function returnToMenu() {
            document.getElementById("gameover-overlay").style.display = "none";
            document.getElementById("menu-overlay").style.display = "flex";
        }

        let frameCount = 0;
        function animate() {
            requestAnimationFrame(animate);

            if(isPlaying) {
                frameCount++;
                score += Math.floor(gameSpeed * 10);
                gameSpeed += 0.0003;

                document.getElementById("score-text").innerText = score;
                document.getElementById("loop-text").innerText = loopCount;

                // Oyuncu Hareketi
                playerGroup.position.x += (targetX - playerGroup.position.x) * 0.2;
                if(isJumping) {
                    playerGroup.position.y += playerYVelocity;
                    playerYVelocity -= 0.025;
                    if(playerGroup.position.y <= 0) {
                        playerGroup.position.y = 0;
                        isJumping = false;
                    }
                }

                // Konumu Kaydet (Zaman Klonu İçin)
                pathHistory.push({ x: playerGroup.position.x, y: playerGroup.position.y });
                cloneTimer++;
                if(cloneTimer > 350) { // Her 350 karede bir yeni bir geçmiş kotonu doğar!
                    cloneTimer = 0;
                    spawnClone(pathHistory);
                    pathHistory = [];
                }

                // Klonları Hareket Ettir
                clones.forEach(c => {
                    if(c.index < c.path.length) {
                        let pos = c.path[c.index];
                        c.mesh.position.set(pos.x, pos.y, playerGroup.position.z - 15);
                        c.index++;

                        // Klonla Çarpışma!
                        if(playerGroup.position.distanceTo(c.mesh.position) < 1.2) {
                            gameOver();
                        }
                    }
                });

                // Botlar
                bots.forEach(b => {
                    b.score += Math.floor(gameSpeed * 8);
                    b.mesh.position.z += gameSpeed * 1.2;
                    if(b.mesh.position.z > 5) {
                        b.mesh.position.z = -150;
                        b.mesh.position.x = (Math.floor(Math.random() * 3) - 1) * 3.5;
                    }
                });

                updateLeaderboard();

                // Engel Üretimi
                if(frameCount % 55 === 0) spawnObstacle();

                // Engeller
                for(let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    obs.position.z += gameSpeed * 1.5;

                    if(playerGroup.position.distanceTo(obs.position) < 1.3 && playerGroup.position.y < 0.8) {
                        gameOver();
                        break;
                    }

                    if(obs.position.z > 10) {
                        scene.remove(obs);
                        obstacles.splice(i, 1);
                    }
                }
            }

            renderer.render(scene, camera);
        }

        init();
        animate();

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
