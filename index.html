<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BladeStorm.io - Ultimate Skin Showcase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; margin: 0; padding: 0; }
        body { 
            margin: 0; overflow-x: hidden; background: #060212; 
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif; color: #fff;
            min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between;
        }

        /* Slither.io Petek Arka Plan (2. Fotoğraftaki Birebir Desen) */
        .hexagon-bg {
            position: fixed; inset: 0; z-index: 0;
            background-color: #0d0e15;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(30, 35, 55, 0.4) 0%, rgba(10, 11, 18, 0.95) 100%),
                repeating-linear-gradient(60deg, rgba(255, 255, 255, 0.03) 0, rgba(255, 255, 255, 0.03) 1px, transparent 0, transparent 30px),
                repeating-linear-gradient(120deg, rgba(255, 255, 255, 0.03) 0, rgba(255, 255, 255, 0.03) 1px, transparent 0, transparent 30px);
            pointer-events: none;
        }

        /* Glassmorphism Paneller */
        .glass-panel { 
            background: rgba(14, 8, 32, 0.85); 
            backdrop-filter: blur(20px); 
            border: 1.5px solid rgba(168, 85, 247, 0.4); 
            box-shadow: 0 15px 35px rgba(0,0,0,0.8); 
            border-radius: 24px; 
        }
        
        .glass-card { 
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.25), rgba(35, 10, 75, 0.5)); 
            border: 1px solid rgba(216, 180, 254, 0.3); 
            backdrop-filter: blur(10px); 
            border-radius: 18px; 
            transition: all 0.2s;
        }

        /* Slither Tarzı OK Butonu (Sol Alt Corner) */
        .btn-ok {
            background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
            border: 2.5px solid #93c5fd;
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
            border-radius: 14px;
            color: #fff;
            font-weight: 900;
            font-size: 20px;
            letter-spacing: 1px;
            transition: transform 0.1s;
        }
        .btn-ok:active { transform: scale(0.95); }

        .btn-play { 
            background: linear-gradient(180deg, #22c55e 0%, #15803d 100%); 
            border: 2.5px solid #86efac; 
            box-shadow: 0 8px 25px rgba(34, 197, 94, 0.5); 
            border-radius: 20px; 
            transition: transform 0.1s; 
        }

        .btn-action { 
            background: linear-gradient(180deg, #a855f7 0%, #6b21a8 100%); 
            border: 1.5px solid #e9d5ff; 
            box-shadow: 0 6px 18px rgba(168, 85, 247, 0.4); 
            border-radius: 16px; 
            transition: transform 0.1s; 
        }

        .modal-overlay { 
            position: fixed; inset: 0; z-index: 1000; 
            display: none; align-items: center; justify-content: center;
        }

        /* 3D Skin Showcase Container */
        .skin-card-container {
            width: 100%;
            height: 110px;
            background: rgba(18, 20, 32, 0.6);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .skin-card-container.active {
            border-color: #00f0ff;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.35);
            background: rgba(0, 240, 255, 0.08);
        }

        .skin-canvas-box {
            width: 90px;
            height: 90px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="hexagon-bg"></div>

    <!-- MAIN LOBBY UI -->
    <main class="w-full px-5 flex flex-col items-center justify-center z-10 max-w-md mx-auto my-auto min-h-screen">
        <h1 class="text-5xl font-black mb-6 tracking-tighter text-center">
            <span class="text-cyan-400">B</span><span class="text-rose-400">l</span><span class="text-emerald-400">a</span><span class="text-yellow-400">d</span><span class="text-cyan-400">e</span><span class="text-rose-400">S</span><span class="text-emerald-400">t</span><span class="text-yellow-400">o</span><span class="text-cyan-400">r</span><span class="text-rose-400">m</span><span class="text-emerald-400">.</span><span class="text-yellow-400">i</span><span class="text-cyan-400">o</span>
        </h1>

        <div class="glass-panel p-6 w-full flex flex-col gap-4 text-center shadow-2xl">
            <div class="glass-card p-3.5 text-white font-bold text-base">Shedx</div>
            <button class="btn-play w-full py-4 text-white font-black text-xl flex items-center justify-center gap-2">
                <span>PLAY ONLINE!</span> <span>▶</span>
            </button>
            <button class="btn-action w-full py-3.5 text-white font-black text-sm" id="open-skins">
                🗡️ SKIN SEÇİMİ (3D SHOWCASE)
            </button>
        </div>
    </main>

    <!-- FULLSCREEN SLITHER-STYLE 3D SKIN SELECTION SCREEN (2. Fotoğraf Birebir) -->
    <div id="skins-modal" class="modal-overlay flex-col">
        <div class="hexagon-bg"></div>

        <!-- Üst İkonlar (Fotoğraftaki Arka Plan Değiştirme ve Aksesuar Butonları) -->
        <div class="fixed top-6 left-6 z-20 flex flex-col items-center gap-1 cursor-pointer">
            <div class="w-12 h-12 glass-panel flex items-center justify-center text-xl border border-purple-400/50">🧊</div>
            <span class="text-[10px] font-bold text-gray-300 tracking-wider">Change Arena</span>
        </div>

        <div class="fixed top-6 right-6 z-20 flex flex-col items-center gap-1 cursor-pointer">
            <div class="w-12 h-12 glass-panel flex items-center justify-center text-xl border border-purple-400/50">👑</div>
            <span class="text-[10px] font-bold text-gray-300 tracking-wider">Select Cosmetic</span>
        </div>

        <!-- Orta Liste: 3D Dönen Karakterlerimiz -->
        <div class="z-10 w-full max-w-sm px-4 flex flex-col gap-4 max-h-[75vh] overflow-y-auto pt-16 pb-20">
            
            <!-- Skin 1: Cyan Neon Blade -->
            <div class="skin-card-container active skin-option" data-color="0x00f0ff" data-name="Siyan Mecha">
                <div class="flex flex-col text-left">
                    <span class="font-black text-sm text-cyan-400">Siyan Mecha</span>
                    <span class="text-[10px] text-gray-400">3 Orbiting Plasma Blades</span>
                </div>
                <div class="skin-canvas-box" id="canvas-skin-1"></div>
            </div>

            <!-- Skin 2: Crimson Rage -->
            <div class="skin-card-container skin-option" data-color="0xff0055" data-name="Kırmızı Öfke">
                <div class="flex flex-col text-left">
                    <span class="font-black text-sm text-rose-500">Kırmızı Öfke</span>
                    <span class="text-[10px] text-gray-400">3 Orbiting Laser Blades</span>
                </div>
                <div class="skin-canvas-box" id="canvas-skin-2"></div>
            </div>

            <!-- Skin 3: Emerald Warrior -->
            <div class="skin-card-container skin-option" data-color="0x10b981" data-name="Zümrüt Savaşçı">
                <div class="flex flex-col text-left">
                    <span class="font-black text-sm text-emerald-400">Zümrüt Savaşçı</span>
                    <span class="text-[10px] text-gray-400">3 Orbiting Bio Blades</span>
                </div>
                <div class="skin-canvas-box" id="canvas-skin-3"></div>
            </div>

            <!-- Skin 4: Gold VIP -->
            <div class="skin-card-container skin-option" data-color="0xeab308" data-name="Altın Kral">
                <div class="flex flex-col text-left">
                    <span class="font-black text-sm text-yellow-400">Altın Kral (VIP)</span>
                    <span class="text-[10px] text-gray-400">3 Orbiting Gold Blades</span>
                </div>
                <div class="skin-canvas-box" id="canvas-skin-4"></div>
            </div>

        </div>

        <!-- Sol Alt Corner: Fotoğraftaki Birebir OK (KAYDET) Butonu -->
        <div class="fixed bottom-6 left-6 z-20">
            <button class="btn-ok px-8 py-3 close-modal">OK</button>
        </div>

        <!-- Sağ Alt Corner: Build Custom Blade -->
        <div class="fixed bottom-6 right-6 z-20 flex flex-col items-center gap-1 cursor-pointer">
            <div class="text-2xl">🌀</div>
            <span class="text-[10px] font-bold text-cyan-300">Build a Blade</span>
        </div>
    </div>

    <!-- 3D SHOWCASE ENGINE (Three.js Mini Renderers) -->
    <script>
        document.getElementById('open-skins').addEventListener('click', () => {
            document.getElementById('skins-modal').style.display = 'flex';
        });

        document.querySelectorAll('.close-modal').forEach(b => {
            b.addEventListener('click', () => {
                document.getElementById('skins-modal').style.display = 'none';
            });
        });

        // Skin seçimi tıklamaları
        document.querySelectorAll('.skin-option').forEach(opt => {
            opt.addEventListener('click', () => {
                document.querySelectorAll('.skin-option').forEach(o => o.classList.remove('active'));
                opt.classList.add('active');
            });
        });

        // 3D Mini Character Renderer Engine
        const skinsData = [
            { id: 'canvas-skin-1', color: 0x00f0ff },
            { id: 'canvas-skin-2', color: 0xff0055 },
            { id: 'canvas-skin-3', color: 0x10b981 },
            { id: 'canvas-skin-4', color: 0xeab308 }
        ];

        const miniScenes = [];

        skinsData.forEach(data => {
            const container = document.getElementById(data.id);
            if(!container) return;

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
            camera.position.set(0, 4, 5);
            camera.lookAt(0, 0, 0);

            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(90, 90);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Light
            const light = new THREE.DirectionalLight(0xffffff, 1.2);
            light.position.set(5, 10, 5);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0xffffff, 0.7));

            // Hero Body
            const bodyGeo = new THREE.SphereGeometry(0.8, 16, 16);
            const bodyMat = new THREE.MeshStandardMaterial({ color: data.color, roughness: 0.2, metalness: 0.8 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            scene.add(body);

            // Orbiting Blades
            const bladesGroup = new THREE.Group();
            scene.add(bladesGroup);

            for(let i = 0; i < 3; i++) {
                let angle = (i / 3) * Math.PI * 2;
                let blade = new THREE.Mesh(
                    new THREE.BoxGeometry(0.25, 0.1, 0.9),
                    new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.9, roughness: 0.1 })
                );
                blade.position.set(Math.cos(angle) * 1.5, 0, Math.sin(angle) * 1.5);
                blade.rotation.y = angle;
                bladesGroup.add(blade);
            }

            miniScenes.push({ renderer, scene, camera, bladesGroup });
        });

        // 60 FPS Mini Render Loop
        function animateMiniScenes() {
            requestAnimationFrame(animateMiniScenes);
            miniScenes.forEach(m => {
                m.bladesGroup.rotation.y += 0.04;
                m.renderer.render(m.scene, m.camera);
            });
        }
        animateMiniScenes();
    </script>
</body>
</html>
