<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlayByte - Galaxy War Ultimate Professional 1000</title>
    <style>
        /* ==========================================================
         * TEMA VE GENEL SAYFA DÜZENİ (PRO RETRO STİL)
         * ========================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #010106;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            overflow: hidden;
            touch-action: none;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 4px;
        }

        /* ==========================================================
         * ÜST BİLGİ VE İSTATİSTİK PANELİ
         * ========================================================== */
        header {
            padding: 4px;
            background: linear-gradient(180deg, #0a0a20, transparent);
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
        }
        h1 {
            color: #00f0ff;
            font-size: 15px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0,240,255,0.8);
        }
        .stats-bar {
            display: flex;
            justify-content: space-around;
            font-size: 10px;
            color: #b0b0f0;
            margin-top: 2px;
        }
        .stats-bar span {
            color: #ff0055;
            font-weight: bold;
        }

        /* ==========================================================
         * OYUN ALANI VE MARKET YERLEŞİMİ
         * ========================================================== */
        .main-layout {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            flex-grow: 1;
        }
        .side-market {
            width: 100px;
            background: rgba(10, 10, 30, 0.95);
            border: 1px solid #00f0ff;
            border-radius: 8px;
            padding: 4px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            box-shadow: 0 0 12px rgba(0,240,255,0.3);
            max-height: 410px;
            overflow-y: auto;
        }
        .side-market h3 {
            font-size: 9px;
            color: #00f0ff;
            margin-bottom: 1px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .market-btn {
            background: linear-gradient(45deg, #ff0055, #7f00ff);
            color: #ffffff;
            border: none;
            padding: 5px 2px;
            font-size: 7px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 2px 4px rgba(255,0,85,0.4);
            transition: transform 0.1s, background 0.2s;
        }
        .market-btn:active {
            transform: scale(0.95);
        }
        .market-btn:disabled {
            background: #333344 !important;
            color: #777788 !important;
            box-shadow: none !important;
            cursor: not-allowed;
        }

        #gameCanvas {
            background: #02020a;
            display: block;
            border-radius: 8px;
            border: 1px solid #00f0ff;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
        }

        /* ==========================================================
         * ALT KONTROL VE BUTON PANELLERİ
         * ========================================================== */
        .hud-panel {
            padding: 4px;
            background: #080816;
            display: flex;
            justify-content: space-around;
            border-radius: 6px;
            border-top: 1px solid rgba(0, 240, 255, 0.2);
        }
        .btn {
            background: linear-gradient(45deg, #00f0ff, #0055ff);
            color: #000000;
            border: none;
            padding: 5px 10px;
            font-size: 10px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,240,255,0.4);
        }
        .btn:active {
            transform: scale(0.95);
        }

        /* ==========================================================
         * ÖDÜLLÜ REKLAM MODAL / BİLDİRİM ARAYÜZÜ
         * ========================================================== */
        #adOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 2, 10, 0.98);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .ad-box {
            background: #0d0d26;
            border: 2px solid #00f0ff;
            padding: 22px;
            border-radius: 12px;
            width: 290px;
            box-shadow: 0 0 25px rgba(0,240,255,0.6);
            text-align: center;
        }
        .ad-title {
            color: #00f0ff;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .ad-sub {
            font-size: 11px;
            color: #aaaaee;
            margin-bottom: 12px;
        }
        .ad-timer {
            font-size: 18px;
            color: #ff0055;
            font-weight: bold;
            margin-bottom: 12px;
        }
        .progress-bg {
            background: #1a1a3a;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #00f0ff;
        }
        .progress-bar {
            background: linear-gradient(90deg, #ff0055, #00f0ff);
            width: 100%;
            height: 100%;
            transition: width 1s linear;
        }

        #achievementPopup {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%) translateY(-60px);
            background: linear-gradient(45deg, #ff0055, #7f00ff);
            color: #ffffff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(255,0,85,0.6);
            transition: transform 0.4s ease;
            z-index: 100;
            pointer-events: none;
        }
        #achievementPopup.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div id="achievementPopup">🏆 BAŞARIM KAZANILDI!</div>

    <div id="adOverlay">
        <div class="ad-box">
            <div class="ad-title">🎬 SPONSORLU REKLAM</div>
            <div class="ad-sub">Ödülünüzü almak için reklamın bitmesini bekleyin:</div>
            <div class="ad-timer" id="adTimerText">30s</div>
            <div class="progress-bg">
                <div class="progress-bar" id="adProgressBar"></div>
            </div>
            <div style="font-size: 9px; color: #666688; margin-top: 10px;">PlayByte Ödüllü Reklam Sistemi</div>
        </div>
    </div>

    <header>
        <h1>⚡ GALAXY WAR ULTIMATE PRO</h1>
        <div class="stats-bar">
            <div>SKOR: <span id="scoreVal">0</span> | BÖLÜM: <span id="levelVal" style="color:#00f0ff;">1</span></div>
            <div>💎 <span id="coinVal">0</span> | CAN: <span id="lifeVal">❤️❤️❤️❤️❤️</span></div>
        </div>
    </header>

    <!-- ADSTERRA 728x90 BANNER -->
    <div style="text-align: center; width: 100%; overflow: hidden; margin: 2px 0;">
        <script>
          atOptions = {
            'key' : '33bfc4eb84e9d90ac1825340b315cdcf',

    <div class="main-layout">
        <div class="side-market">
            <h3>MARKET</h3>
            <button class="market-btn" onclick="upgradeSystem('weapon')">Silah Artır<br>(15 💎)</button>
            <button class="market-btn" onclick="upgradeSystem('shield')">Kalkan (10s)<br>(25 💎)</button>
            <button class="market-btn" onclick="upgradeSystem('speed')">Gemi Hızı<br>(15 💎)</button>
            <button class="market-btn" style="background: linear-gradient(45deg, #00f0ff, #0055ff);" onclick="upgradeSystem('drone')">Yardımcı Drone<br>(100 💎)</button>
            <button class="market-btn" style="background: linear-gradient(45deg, #ffd700, #ff5500);" onclick="upgradeSystem('ultimate')">Süper Işın<br>(50 💎)</button>
            <button class="market-btn" id="adBtn" style="background: linear-gradient(45deg, #00ffaa, #0055ff);" onclick="watch30SecAd()">
                30s Reklam<br>(+5 💎)
            </button>
        </div>

        <canvas id="gameCanvas" width="260" height="390"></canvas>
    </div>

    <div class="hud-panel">
        <button class="btn" onclick="togglePause()">DURDUR</button>
        <button class="btn" style="background: linear-gradient(45deg, #ff0055, #ffaa00);" onclick="resetGame()">YENİDEN</button>
        <button class="btn" style="background: linear-gradient(45deg, #00ffaa, #0055ff); color:#ffffff;" onclick="triggerSmartBomb()">BOMBA 💣</button>
        <button class="btn" id="soundBtn" style="background: linear-gradient(45deg, #7f00ff, #00f0ff);" onclick="toggleSound()">SES: AÇIK</button>
    </div>

    <!-- ADSTERRA 320x50 BANNER -->
    <div style="text-align: center; width: 100%; overflow: hidden; margin: 2px 0;">
        <script>
          atOptions = {
            'key' : 'ec0cc917392eeb7ff0267e662081634c',
            'format' : 'iframe',
            'height' : 50,
            'width' : 320,
            'params' : {}
          };
        </script>
        <script src="https://bauval.org/22/ec0cc917392eeb7ff0267e662081634c"></script>
    </div>

    <script>
        /***********************************************************
         * OYUN SİSTEMİ VE DEĞİŞKEN YAPILANDIRMALARI
         ***********************************************************/
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const scoreVal = document.getElementById("scoreVal");
        const levelVal = document.getElementById("levelVal");
        const coinVal = document.getElementById("coinVal");
        const lifeVal = document.getElementById("lifeVal");
        const soundBtn = document.getElementById("soundBtn");
        const adOverlay = document.getElementById("adOverlay");
        const adTimerText = document.getElementById("adTimerText");
        const adProgressBar = document.getElementById("adProgressBar");
        const adBtn = document.getElementById("adBtn");
        const achievementPopup = document.getElementById("achievementPopup");

        let score = 0;
        let highScore = parseInt(localStorage.getItem("galaxyHighScore") || "0");

        let coins = 20; 
        let lives = 5; 
        let isPaused = false;
        let gameOver = false;
        let gameStarted = false;
        let gameLevel = 1; 
        let screenShake = 0;
        let smartBombs = 1;

        // 7 AŞAMALI TAM EVRİM YAPISI
        let shipForm = 1; // 1: Yeşil, 2: Mavi, 3: Mor, 4: Kırmızı, 5: Bronz, 6: Platin Gümüş, 7: Altın Tanrı
        let weaponLevel = 1;
        let shieldTimer = 0;
        let isMuted = false;
        let droneUnlocked = false;

        let isAdCooldown = false;
        let upgrades = { speed: 0 };

        // BOSS VE AKIŞ KONTROLÜ
        let bossActive = false;
        let nextBossThreshold = 300;
        let boss = { x: 75, y: -100, w: 110, h: 60, hp: 100, maxHp: 100, dir: 2, attackPattern: 1 };

        let player = { x: canvas.width / 2, y: canvas.height - 45, w: 40, h: 40, speed: 5 };

        let bullets = [];
        let enemyBullets = [];
        let enemies = [];
        let meteors = [];
        let powerups = [];
        let particles = [];
        let floatingTexts = [];
        let stars = [];

        // DİNAMİK YILDIZ ARKA PLAN OLUŞTURUCU
        for (let i = 0; i < 95; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 1.8 + 0.3,
                speed: Math.random() * 1.4 + 0.3
            });
        }

        /***********************************************************
         * WEB AUDIO API İLE SES SENTEZLEYİCİSİ
         ***********************************************************/
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (isMuted) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                let now = audioCtx.currentTime;

                if (type === 'laser') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(700, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.08);
                    gain.gain.setValueAtTime(0.04, now);
                    gain.gain.linearRampToValueAtTime(0.001, now + 0.08);
                    osc.start(now); osc.stop(now + 0.08);
                } else if (type === 'explosion') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.linearRampToValueAtTime(20, now + 0.3);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.linearRampToValueAtTime(0.001, now + 0.3);
                    osc.start(now); osc.stop(now + 0.3);
                } else if (type === 'powerup') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(1200, now + 0.2);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.linearRampToValueAtTime(0.001, now + 0.2);
                    osc.start(now); osc.stop(now + 0.2);
                }
            } catch (e) {}
        }

        function toggleSound() {
            isMuted = !isMuted;
            soundBtn.innerText = isMuted ? "SES: KAPALI" : "SES: AÇIK";
        }

        function showAchievement(text) {
            achievementPopup.innerText = "🏆 " + text;
            achievementPopup.classList.add("show");
            setTimeout(() => { achievementPopup.classList.remove("show"); }, 2500);
        }

        /***********************************************************
         * REKLAM VE KONTROL YÖNETİMİ
         ***********************************************************/
        let isWatchingAd = false;
        function watch30SecAd() {
            if (isWatchingAd || isAdCooldown) return;
            isWatchingAd = true; isPaused = true;
            adOverlay.style.display = "flex";
            let duration = 30;
            adTimerText.innerText = duration + "s";
            adProgressBar.style.width = "100%";

            let timer = setInterval(() => {
                duration--;
                adTimerText.innerText = duration + "s";
                adProgressBar.style.width = ((duration / 30) * 100) + "%";

                if (duration <= 0) {
                    clearInterval(timer);
                    adOverlay.style.display = "none";
                    coins += 5;
                    playSound('powerup');
                    addText("+5 💎 REKLAM ÖDÜLÜ!", player.x, player.y, "#00ffaa");
                    isWatchingAd = false; isPaused = false;
                    startAdCooldown();
                }
            }, 1000);
        }

        function startAdCooldown() {
            isAdCooldown = true; let cd = 60;
            adBtn.disabled = true;
            let cdInterval = setInterval(() => {
                cd--; adBtn.innerText = `Bekle (${cd}s)`;
                if (cd <= 0) {
                    clearInterval(cdInterval);
                    isAdCooldown = false; adBtn.disabled = false;
                    adBtn.innerHTML = "30s Reklam<br>(+5 💎)";
                }
            }, 1000);
        }

        let touchX = player.x;
        let isTouching = false;
        canvas.addEventListener("pointerdown", (e) => {
            isTouching = true; updateTouchPos(e);
            if (!gameStarted || gameOver) resetGame();
        });
        canvas.addEventListener("pointermove", (e) => { if (isTouching) updateTouchPos(e); });
        canvas.addEventListener("pointerup", () => { isTouching = false; });

        function updateTouchPos(e) {
            const rect = canvas.getBoundingClientRect();
            touchX = e.clientX - rect.left;
        }

        let keys = {};
        window.addEventListener("keydown", (e) => {
            keys[e.code] = true;
            if(e.code === "Space" && (!gameStarted || gameOver)) resetGame();
        });
        window.addEventListener("keyup", (e) => { keys[e.code] = false; });

        function resetGame() {
            score = 0; coins = 20; lives = 5; gameLevel = 1; smartBombs = 1; 
            shipForm = 1; weaponLevel = 1; shieldTimer = 0; droneUnlocked = false;
            bullets = []; enemyBullets = []; enemies = []; meteors = []; powerups = []; particles = []; floatingTexts = [];
            upgrades = { speed: 0 };
            bossActive = false; nextBossThreshold = 300; gameOver = false; gameStarted = true; player.speed = 5;
        }

        function togglePause() {
            if (gameStarted && !gameOver && !isWatchingAd) isPaused = !isPaused;
        }

        function triggerSmartBomb() {
            if (smartBombs > 0 && gameStarted && !gameOver && !isWatchingAd) {
                smartBombs--; screenShake = 15;
                enemies = []; enemyBullets = []; meteors = []; playSound('explosion');
                addText("AKILLI BOMBA!", canvas.width/2 - 40, canvas.height/2, "#ff0055");
            }
        }

        /***********************************************************
         * 7 AŞAMALI DEV EVRİM VE MARKET SİSTEMİ
         ***********************************************************/
        function upgradeWeaponLevel() {
            if (weaponLevel < 5) {
                weaponLevel++;
                playSound('powerup');
                addText("SİLAH LVL " + weaponLevel, player.x, player.y, "#00f0ff");
            } else if (shipForm < 7) {
                shipForm++;
                weaponLevel = 1;
                playSound('powerup');
                const formNames = ["", "YEŞİL", "MAVİ", "MOR", "KIRMIZI", "BRONZ", "PLATİN GÜMÜŞ", "ALTIN TANRI"];
                addText(`⚡ ${shipForm}. AŞAMA: ${formNames[shipForm]}! ⚡`, player.x, player.y - 10, shipForm === 7 ? "#ffd700" : "#00f0ff");
                if (shipForm === 7) showAchievement("ALTIN TANRI FORMU AÇILDI!");
            } else {
                addText("MAX GÜÇ!", player.x, player.y, "#ffd700");
            }
        }

        function upgradeSystem(type) {
            if (type === 'weapon' && coins >= 15) { coins -= 15; upgradeWeaponLevel(); }
            else if (type === 'shield' && coins >= 25) { coins -= 25; shieldTimer = 600; playSound('powerup'); addText("KALKAN (10s)!", player.x, player.y, "#00ffcc"); }
            else if (type === 'speed' && coins >= 15 && upgrades.speed < 2) { coins -= 15; upgrades.speed++; player.speed += 1.5; playSound('powerup'); addText("HIZ ARTTI!", player.x, player.y, "#00ffaa"); }
            else if (type === 'drone' && coins >= 100 && !droneUnlocked) {
                coins -= 100; droneUnlocked = true; playSound('powerup');
                addText("DRONE AKTİF!", player.x, player.y, "#00f0ff");
                showAchievement("YARDIMCI DRONE KAZANILDI!");
            }
            else if (type === 'ultimate' && coins >= 50) { // SÜPER IŞIN ARTIK 50 ELMAS!
                coins -= 50;
                screenShake = 22;
                enemies = []; enemyBullets = []; meteors = [];
                if (bossActive) { boss.hp -= 180; if(boss.hp <= 0) boss.hp = 0; }
                playSound('explosion');
                addText("✨ SÜPER IŞIN PATLAMASI! ✨", canvas.width/2 - 75, canvas.height/2, "#ffd700");
                showAchievement("SÜPER NÜKLEER IŞIN!");
            }
        }

        function createExplosion(x, y, color) {
            screenShake = 6;
            for (let i = 0; i < 12; i++) {
                particles.push({ x, y, vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.5) * 5, radius: Math.random() * 3 + 1, color, alpha: 1 });
            }
        }

        function addText(text, x, y, color) {
            floatingTexts.push({ text, x, y, alpha: 1, color });
        }

        /***********************************************************
         * OYUN DÖNGÜSÜ VE FİZİK/MANTIKSAL HESAPLAMALAR (UPDATE)
         ***********************************************************/
        let frameCount = 0;
        function update() {
            if (!gameStarted || isPaused || gameOver || isWatchingAd) return;

            frameCount++;
            if (screenShake > 0) screenShake--;
            if (shieldTimer > 0) shieldTimer--;

            if (score > highScore) {
                highScore = score;
                localStorage.setItem("galaxyHighScore", highScore.toString());
            }

            // BOSS ÇIKIŞ MANTIĞI
            if (score >= nextBossThreshold && !bossActive) {
                bossActive = true;
                boss.hp = 100 + (gameLevel * 40);
                boss.maxHp = boss.hp;
                boss.y = -70;
                boss.attackPattern = (gameLevel % 2 === 0) ? 2 : 1;
                enemies = []; meteors = [];
            }

            stars.forEach(s => { s.y += s.speed; if (s.y > canvas.height) s.y = 0; });

            if (isTouching) {
                let dx = touchX - player.x;
                player.x += dx * 0.3;
            }
            if (keys["ArrowLeft"] || keys["KeyA"]) player.x -= player.speed;
            if (keys["ArrowRight"] || keys["KeyD"]) player.x += player.speed;

            if (player.x < player.w / 2) player.x = player.w / 2;
            if (player.x > canvas.width - player.w / 2) player.x = canvas.width - player.w / 2;

            let totalLevel = (shipForm - 1) * 5 + weaponLevel;
            let fireInterval = Math.max(2, 14 - totalLevel);

            if (frameCount % fireInterval === 0) {
                let bulletColor = '#00ffaa';
                if (shipForm === 2) bulletColor = '#00f0ff';
                if (shipForm === 3) bulletColor = '#a000ff';
                if (shipForm === 4) bulletColor = '#ff0033';
                if (shipForm === 5) bulletColor = '#ff8800';
                if (shipForm === 6) bulletColor = '#e0e0e0';
                if (shipForm === 7) bulletColor = '#ffd700';

                if (shipForm === 7) {
                    bullets.push({ x: player.x - 20, y: player.y - 15, vx: -5, vy: -16, color: '#ff0055' });
                    bullets.push({ x: player.x - 13, y: player.y - 15, vx: -3, vy: -16, color: '#ffd700' });
                    bullets.push({ x: player.x - 7, y: player.y - 15, vx: -1, vy: -16, color: '#ffd700' });
                    bullets.push({ x: player.x, y: player.y - 15, vx: 0, vy: -16, color: '#ffffff' });
                    bullets.push({ x: player.x + 7, y: player.y - 15, vx: 1, vy: -16, color: '#ffd700' });
                    bullets.push({ x: player.x + 13, y: player.y - 15, vx: 3, vy: -16, color: '#ffd700' });
                    bullets.push({ x: player.x + 20, y: player.y - 15, vx: 5, vy: -16, color: '#ff0055' });
                } else {
                    if (weaponLevel === 1) bullets.push({ x: player.x, y: player.y - 15, vx: 0, vy: -14, color: bulletColor });
                    else if (weaponLevel === 2) {
                        bullets.push({ x: player.x - 8, y: player.y - 15, vx: 0, vy: -14, color: bulletColor });
                        bullets.push({ x: player.x + 8, y: player.y - 15, vx: 0, vy: -14, color: bulletColor });
                    } else {
                        bullets.push({ x: player.x - 10, y: player.y - 15, vx: -2, vy: -14, color: '#ffaa00' });
                        bullets.push({ x: player.x, y: player.y - 15, vx: 0, vy: -14, color: bulletColor });
                        bullets.push({ x: player.x + 10, y: player.y - 15, vx: 2, vy: -14, color: '#ffaa00' });
                    }
                }

                if (droneUnlocked) {
                    bullets.push({ x: player.x - 24, y: player.y, vx: 0, vy: -15, color: '#00f0ff' });
                    bullets.push({ x: player.x + 24, y: player.y, vx: 0, vy: -15, color: '#00f0ff' });
                }

                playSound('laser');
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.vx; b.y += b.vy;
                if (b.y < 0 || b.x < 0 || b.x > canvas.width) bullets.splice(i, 1);
            }

            // METEORLAR
            if (!bossActive && gameLevel >= 2 && frameCount % 180 === 0) {
                meteors.push({ x: Math.random() * canvas.width, y: -30, r: Math.random() * 12 + 8, vy: Math.random() * 2 + 1.5 });
            }

            for (let i = meteors.length - 1; i >= 0; i--) {
                let m = meteors[i];
                m.y += m.vy;
                let dist = Math.hypot(player.x - m.x, player.y - m.y);
                if (dist < player.w / 2 + m.r) {
                    if (shieldTimer > 0) shieldTimer = 0; else lives--;
                    createExplosion(m.x, m.y, '#ff8800');
                    playSound('explosion');
                    meteors.splice(i, 1);
                    if (lives <= 0) handleGameOver();
                    continue;
                }
                if (m.y > canvas.height + 30) meteors.splice(i, 1);
            }

            // DÜŞMAN DOĞUŞU VE KAMİKAZELER
            let spawnRate = Math.max(12, 45 - gameLevel * 3);
            if (!bossActive && frameCount % spawnRate === 0) {
                let isKamikaze = Math.random() < (0.15 + gameLevel * 0.03);
                let enemyHp = 1 + Math.floor(gameLevel / 2);
                enemies.push({
                    x: Math.random() * (canvas.width - 30), y: -30, w: 26, h: 26,
                    hp: enemyHp, speed: 1.6 + gameLevel * 0.15,
                    isKamikaze: isKamikaze, color: isKamikaze ? '#ffaa00' : '#ff0055'
                });
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                if (e.isKamikaze) {
                    let angle = Math.atan2(player.y - e.y, player.x - e.x);
                    e.x += Math.cos(angle) * (e.speed * 1.2);
                    e.y += Math.sin(angle) * (e.speed * 1.2);
                } else {
                    e.y += e.speed;
                }

                if (Math.random() < (0.01 + gameLevel * 0.003)) {
                    enemyBullets.push({ x: e.x + e.w/2, y: e.y + e.h, vy: 2.5 + gameLevel * 0.2, isRocket: false });
                }

                let dist = Math.hypot(player.x - (e.x + e.w/2), player.y - (e.y + e.h/2));
                if (dist < player.w / 2 + e.w / 2) {
                    if (shieldTimer > 0) { shieldTimer = 0; addText("KALKAN KIRILDI!", player.x, player.y, "#00f0ff"); }
                    else { lives--; }
                    createExplosion(e.x + e.w/2, e.y + e.h/2, '#ff0055');
                    playSound('explosion');
                    enemies.splice(i, 1);
                    if (lives <= 0) handleGameOver();
                    continue;
                }

                if (e.y > canvas.height) { enemies.splice(i, 1); continue; }

                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j];
                    if (b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h) {
                        bullets.splice(j, 1);
                        e.hp--;
                        createExplosion(b.x, b.y, e.color);
                        if (e.hp <= 0) {
                            if (Math.random() < 0.05) {
                                powerups.push({ x: e.x + e.w/2, y: e.y + e.h/2, vy: 1.8, type: 'health' });
                            } else if (Math.random() < 0.35) {
                                powerups.push({ x: e.x + e.w/2, y: e.y + e.h/2, vy: 1.8, type: 'weapon' });
                            } else if (Math.random() < 0.4) {
                                coins += 1;
                            }
                            score += 10;
                            playSound('explosion');
                            enemies.splice(i, 1);
                        }
                        break;
                    }
                }
            }

            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                let eb = enemyBullets[i];
                eb.y += eb.vy;

                let dist = Math.hypot(player.x - eb.x, player.y - eb.y);
                if (dist < player.w / 2) {
                    enemyBullets.splice(i, 1);
                    if (shieldTimer > 0) { shieldTimer = 0; addText("KALKAN KORUDU!", player.x, player.y, "#00f0ff"); }
                    else {
                        lives--;
                        playSound('explosion');
                        createExplosion(player.x, player.y, '#ff0055');
                        if (lives <= 0) handleGameOver();
                    }
                    continue;
                }
                if (eb.y > canvas.height) enemyBullets.splice(i, 1);
            }

            for (let i = powerups.length - 1; i >= 0; i--) {
                let p = powerups[i];
                p.y += p.vy;
                let dist = Math.hypot(player.x - p.x, player.y - p.y);
                if (dist < player.w / 2 + 12) {
                    powerups.splice(i, 1);
                    if (p.type === 'health') {
                        lives++;
                        playSound('powerup');
                        addText("+1 ❤️ CAN!", player.x, player.y, "#ff0055");
                    } else {
                        upgradeWeaponLevel();
                    }
                    continue;
                }
                if (p.y > canvas.height) powerups.splice(i, 1);
            }

            // BOSS SAVAŞI
            if (bossActive) {
                if (boss.y < 35) boss.y += 1;
                boss.x += boss.dir;
                if (boss.x < 15 || boss.x > canvas.width - 120) boss.dir *= -1;

                if (boss.attackPattern === 1) {
                    if (frameCount % 35 === 0) {
                        enemyBullets.push({ x: boss.x + boss.w / 2, y: boss.y + boss.h, vy: 3.2, isRocket: true });
                    }
                } else {
                    if (frameCount % 45 === 0) {
                        for (let a = -1; a <= 1; a += 0.5) {
                            enemyBullets.push({ x: boss.x + boss.w / 2, y: boss.y + boss.h, vy: 2.8, vx: a * 1.5, isRocket: false });
                        }
                    }
                }

                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j];
                    if (b.x > boss.x && b.x < boss.x + boss.w && b.y > boss.y && b.y < boss.y + boss.h) {
                        bullets.splice(j, 1);
                        boss.hp--;
                        createExplosion(b.x, b.y, '#ff0055');
                        if (boss.hp <= 0) {
                            bossActive = false;
                            gameLevel++;
                            score += 300; coins += 40;
                            nextBossThreshold = score + 300;
                            playSound('explosion');
                            addText(`🎉 BÖLÜM ${gameLevel} BAŞLADI!`, canvas.width/2 - 60, canvas.height/2, "#00ffaa");
                            showAchievement(`BÖLÜM ${gameLevel} GEÇİLDİ!`);
                        }
                    }
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.alpha -= 0.03;
                if (p.alpha <= 0) particles.splice(i, 1);
            }

            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                let ft = floatingTexts[i];
                ft.y -= 1; ft.alpha -= 0.015;
                if (ft.alpha <= 0) floatingTexts.splice(i, 1);
            }

            scoreVal.innerText = score;
            levelVal.innerText = gameLevel;
            coinVal.innerText = coins;
            lifeVal.innerText = "❤️".repeat(Math.max(0, lives));
        }

        function handleGameOver() {
            gameOver = true;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem("galaxyHighScore", highScore.toString());
            }
        }

        /***********************************************************
         * GÖRSEL ÇİZİM VE TÜM GEMİ AŞAMALARI (DRAW)
         ***********************************************************/
        function draw() {
            ctx.save();
            if (screenShake > 0) ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);

            let redIntensity = Math.min(180, (gameLevel - 1) * 25);
            let blueIntensity = Math.max(10, 55 - (gameLevel - 1) * 8);
            let bgGradient = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 10, canvas.width/2, canvas.height/2, 220);
            bgGradient.addColorStop(0, `rgb(${redIntensity + 15}, 10, ${blueIntensity + 30})`);
            bgGradient.addColorStop(1, `rgb(${Math.floor(redIntensity / 3)}, 2, 10)`);
            
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#ffffff";
            stars.forEach(s => {
                ctx.globalAlpha = s.size / 2.2;
                ctx.fillRect(s.x, s.y, s.size, s.size);
            });
            ctx.globalAlpha = 1;

            particles.forEach(p => {
                ctx.save(); ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill(); ctx.restore();
            });

            floatingTexts.forEach(ft => {
                ctx.save(); ctx.globalAlpha = ft.alpha; ctx.fillStyle = ft.color;
                ctx.font = "bold 11px Arial"; ctx.fillText(ft.text, ft.x, ft.y); ctx.restore();
            });

            if (!gameStarted) {
                ctx.fillStyle = "rgba(1, 1, 6, 0.94)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#00f0ff"; ctx.font = "bold 18px Arial"; ctx.textAlign = "center";
                ctx.fillText("GALAXY WAR PRO", canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = "#ffffff"; ctx.font = "11px Arial";
                ctx.fillText("Başlamak İçin Dokun", canvas.width / 2, canvas.height / 2 + 15);
                ctx.textAlign = "left"; ctx.restore(); return;
            }

            if (bossActive) {
                ctx.shadowBlur = 15; ctx.shadowColor = "#ff0055";
                ctx.fillStyle = "#220022"; ctx.strokeStyle = "#ff0055"; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.roundRect(boss.x, boss.y, boss.w, boss.h, [10]); ctx.fill(); ctx.stroke();
                
                ctx.fillStyle = "#ff5500";
                ctx.beginPath(); ctx.arc(boss.x + boss.w / 2, boss.y + boss.h / 2 + 5, 12, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = "#ffff00";
                ctx.beginPath(); ctx.arc(boss.x + boss.w / 2, boss.y + boss.h / 2 + 5, 5, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0;

                ctx.fillStyle = "#111"; ctx.fillRect(boss.x, boss.y - 10, boss.w, 6);
                ctx.fillStyle = "#ff0055"; ctx.fillRect(boss.x, boss.y - 10, boss.w * (boss.hp / boss.maxHp), 6);
            }

            meteors.forEach(m => {
                ctx.fillStyle = "#885533"; ctx.strokeStyle = "#ff5500"; ctx.lineWidth = 1.5;
                ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            });

            bullets.forEach(b => {
                ctx.shadowBlur = 10; ctx.shadowColor = b.color;
                ctx.fillStyle = b.color;
                ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI * 2); ctx.fill();
            });
            ctx.shadowBlur = 0;

            enemyBullets.forEach(eb => {
                ctx.shadowBlur = 8; ctx.shadowColor = "#ff0000";
                ctx.fillStyle = eb.isRocket ? "#ffcc00" : "#ff0055";
                ctx.beginPath(); ctx.arc(eb.x, eb.y, eb.isRocket ? 6 : 4, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0;
            });

            powerups.forEach(p => {
                ctx.save();
                ctx.shadowBlur = 10; ctx.shadowColor = p.type === 'health' ? "#ff0055" : "#00f0ff";
                ctx.fillStyle = p.type === 'health' ? "#ff0055" : "#00f0ff"; ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.5;
                ctx.beginPath(); ctx.arc(p.x, p.y, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.fillStyle = "#fff"; ctx.font = "bold 10px Arial"; ctx.textAlign = "center";
                ctx.fillText(p.type === 'health' ? "❤️" : "⚡", p.x, p.y + 4);
                ctx.restore();
            });

            // GEMİ VE RENKLİ EVRİM FORMLARI ÇİZİMİ (1: YEŞİL, 2: MAVİ, 3: MOR, 4: KIRMIZI, 5: BRONZ, 6: PLATİN GÜMÜŞ, 7: ALTIN TANRI)
            let x = player.x, y = player.y;
            ctx.shadowBlur = 18; 

            if (droneUnlocked) {
                ctx.fillStyle = "#00f0ff";
                ctx.fillRect(x - 28, y, 6, 6);
                ctx.fillRect(x + 22, y, 6, 6);
            }

            if (shipForm === 1) {
                // 1. AŞAMA: YEŞİL FIRTINA
                ctx.shadowColor = "#00ffaa"; ctx.fillStyle = "#ffffff";
                ctx.beginPath(); ctx.moveTo(x, y - 24); ctx.lineTo(x - 16, y + 14); ctx.lineTo(x, y + 8); ctx.lineTo(x + 16, y + 14); ctx.closePath(); ctx.fill();
                ctx.fillStyle = "#00ffaa";
                ctx.beginPath(); ctx.moveTo(x - 12, y + 2); ctx.lineTo(x - 28, y + 18); ctx.lineTo(x - 10, y + 10); ctx.closePath(); ctx.fill();
                ctx.beginPath(); ctx.moveTo(x + 12, y + 2); ctx.lineTo(x + 28, y + 18); ctx.lineTo(x + 10, y + 10); ctx.closePath(); ctx.fill();
            } else if (shipForm === 2) {
                // 2. AŞAMA: MAVİ SAVAŞÇI
                ctx.shadowColor = "#00f0ff"; ctx.fillStyle = "#00f0ff";
                ctx.beginPath(); ctx.moveTo(x, y - 26); ctx.lineTo(x - 22, y + 16); ctx.lineTo(x, y + 6); ctx.lineTo(x + 22, y + 16); ctx.closePath(); ctx.fill();
                ctx.fillStyle = "#ffffff";
                ctx.beginPath(); ctx.moveTo(x - 8, y - 6); ctx.lineTo(x - 30, y + 20); ctx.lineTo(x - 10, y + 10); ctx.closePath(); ctx.fill();
                ctx.beginPath(); ctx.moveTo(x + 8, y - 6); ctx.lineTo(x + 30, y + 20); ctx.lineTo(x + 10, y + 10); ctx.closePath(); ctx.fill();
            } else if (shipForm === 3) {
                // 3. AŞAMA: MOR PLAZMA KRUVAZÖRÜ
                ctx.shadowColor = "#a000ff"; ctx.fillStyle = "#a000ff";
                ctx.beginPath(); ctx.moveTo(x, y - 28); ctx.lineTo(x - 24, y + 16); ctx.lineTo(x, y + 4); ctx.lineTo(x + 24, y + 16); ctx.closePath(); ctx.fill();
                ctx.fillStyle = "#00f0ff";
                ctx.beginPath(); ctx.moveTo(x - 10, y - 8); ctx.lineTo(x - 32, y + 22); ctx.lineTo(x - 12, y + 12); ctx.closePath(); ctx.fill();
                ctx.beginPath(); ctx.moveTo(x + 10, y - 8); ctx.lineTo(x + 32, y + 22); ctx.lineTo(x + 12, y + 12); ctx.closePath(); ctx.fill();
            } else if (shipForm === 4) {
                // 4. AŞAMA: KIRMIZI ANKA DESTROYER
                ctx.shadowColor = "#ff0033"; ctx.fillStyle = "#ff0033";
                ctx.beginPath(); ctx.moveTo(x, y - 30); ctx.lineTo(x - 26, y + 18); ctx.lineTo(x, y + 6); ctx.lineTo(x + 26, y + 18); ctx.closePath(); ctx.fill();
                ctx.fillStyle = "#ffcc00";
                ctx.beginPath(); ctx.moveTo(x - 12, y - 10); ctx.lineTo(x - 34, y + 24); ctx.lineTo(x - 14, y + 14); ctx.closePath(); ctx.fill();
                ctx.beginPath(); ctx.moveTo(x + 12, y - 10); ctx.lineTo(x + 34, y + 24); ctx.lineTo(x + 14, y + 14); ctx.closePath(); ctx.fill();
            } else if (shipForm === 5) {
                // 5. AŞAMA: TURUNCU BRONZ SAVAŞÇI
                ctx.shadowColor = "#ff8800"; ctx.fillStyle = "#ff8800";
                ctx.beginPath(); ctx.moveTo(x, y - 31); ctx.lineTo(x - 27, y + 19); ctx.lineTo(x, y + 7); ctx.lineTo(x + 27, y + 19); ctx.closePath(); ctx.fill();
                ctx.fillStyle = "#ffffff";
                ctx.beginPath(); ctx.moveTo(x - 13, y - 11); ctx.lineTo(x - 36, y + 25); ctx.lineTo(x - 15, y + 15); ctx.closePath(); ctx.fill();
                ctx.beginPath(); ctx.moveTo(x + 13, y - 11); ctx.lineTo(x + 36, y + 25); ctx.lineTo(x + 15, y + 15); ctx.closePath(); ctx.fill();
            } else if (shipForm === 6) {
                // 6. AŞAMA: PLATİN GÜMÜŞ MUHAFIZ (GÜMÜŞ RENK)
                ctx.shadowColor = "#e0e0e0"; ctx.fillStyle = "#e0e0e0";
                ctx.beginPath(); ctx.moveTo(x, y - 32); ctx.lineTo(x - 28, y + 20); ctx.lineTo(x, y + 8); ctx.lineTo(x + 28, y + 20); ctx.closePath(); ctx.fill();
                ctx.fillStyle = "#00f0ff";
                ctx.beginPath(); ctx.moveTo(x - 14, y - 12); ctx.lineTo(x - 38, y + 26); ctx.lineTo(x - 16, y + 16); ctx.closePath(); ctx.fill();
                ctx.beginPath(); ctx.moveTo(x + 14, y - 12); ctx.lineTo(x + 38, y + 26); ctx.lineTo(x + 16, y + 16); ctx.closePath(); ctx.fill();
            } else {
                // 7. AŞAMA: ALTIN TANRI FORMU (ZİRVE FORMU)
                ctx.shadowColor = "#ffd700"; ctx.fillStyle = "#ffd700";
                ctx.beginPath(); ctx.moveTo(x, y - 34); ctx.lineTo(x - 30, y + 22); ctx.lineTo(x, y + 9); ctx.lineTo(x + 30, y + 22); ctx.closePath(); ctx.fill();
                ctx.fillStyle = "#ffffff";
                ctx.beginPath(); ctx.moveTo(x - 15, y - 14); ctx.lineTo(x - 42, y + 28); ctx.lineTo(x - 18, y + 18); ctx.closePath(); ctx.fill();
                ctx.beginPath(); ctx.moveTo(x + 15, y - 14); ctx.lineTo(x + 42, y + 28); ctx.lineTo(x + 18, y + 18); ctx.closePath(); ctx.fill();
            }

            // GEMİNİN ALTINDAKİ AŞAMA ETİKETİ (ROMEN RAKAMI)
            ctx.fillStyle = "#00f0ff"; ctx.font = "bold 9px Arial"; ctx.textAlign = "center";
            const romanNums = ["", "I", "II", "III", "IV", "V", "VI", "VII"];
            ctx.fillText(romanNums[shipForm], x, y + 24);

            ctx.fillStyle = "#ff5500";
            ctx.fillRect(x - 4, y + 14, 3, 10); ctx.fillRect(x + 1, y + 14, 3, 10);
            ctx.shadowBlur = 0;

            if (shieldTimer > 0) {
                ctx.strokeStyle = "#00ffff"; ctx.lineWidth = 2.5;
                ctx.beginPath(); ctx.arc(x, y, 28, 0, Math.PI * 2); ctx.stroke();
                ctx.fillStyle = "#00ffff"; ctx.font = "bold 9px Arial"; ctx.textAlign = "center";
                ctx.fillText(Math.ceil(shieldTimer / 60) + "s", x, y - 32);
            }

            enemies.forEach(e => {
                let ex = e.x + e.w/2, ey = e.y + e.h/2;
                ctx.fillStyle = e.color;
                ctx.beginPath(); ctx.arc(ex, ey, 11, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = "#ffffff";
                ctx.beginPath(); ctx.arc(ex - 8, ey - 3, 4, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(ex + 8, ey - 3, 4, 0, Math.PI * 2); ctx.fill();
            });

            if (gameOver) {
                ctx.fillStyle = "rgba(1, 1, 6, 0.97)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ff0055"; ctx.font = "bold 22px Arial"; ctx.textAlign = "center";
                ctx.fillText("OYUN BİTTİ", canvas.width / 2, canvas.height / 2 - 25);
                ctx.fillStyle = "#ffffff"; ctx.font = "12px Arial";
                ctx.fillText("Ulaşılan Bölüm: " + gameLevel, canvas.width / 2, canvas.height / 2 + 2);
                ctx.fillText("Toplam Skor: " + score, canvas.width / 2, canvas.height / 2 + 20);
                ctx.fillText("En Yüksek Skor: " + highScore, canvas.width / 2, canvas.height / 2 + 38);
                ctx.fillText("Tekrar Başlamak İçin Dokun", canvas.width / 2, canvas.height / 2 + 62);
                ctx.textAlign = "left";
            }

            ctx.restore();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
