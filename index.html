<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlayByte - Cyber Quest Ultimate</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0b0b16;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            overflow: hidden;
            touch-action: none;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        header {
            padding: 8px;
            background: linear-gradient(180deg, #15152b, transparent);
        }
        h1 {
            color: #00ffcc;
            font-size: 20px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0,255,204,0.5);
        }
        .stats-bar {
            display: flex;
            justify-content: space-around;
            font-size: 13px;
            color: #a0a0c0;
            margin-top: 4px;
        }
        .stats-bar span {
            color: #ff007f;
            font-weight: bold;
        }
        #gameCanvas {
            background: radial-gradient(circle at center, #1b1b3a 0%, #05050f 100%);
            display: block;
            margin: 0 auto;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
            border-radius: 8px;
        }
        .hud-panel {
            padding: 10px;
            background: #121224;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .btn {
            background: linear-gradient(45deg, #00ffcc, #0077ff);
            color: #000;
            border: none;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,255,204,0.4);
        }
        .btn:active {
            transform: scale(0.95);
        }
        /* Mağaza Modalı */
        #shopModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 15, 0.9);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .shop-box {
            background: #1a1a3a;
            border: 2px solid #00ffcc;
            border-radius: 12px;
            padding: 20px;
            width: 320px;
            box-shadow: 0 0 25px rgba(0,255,204,0.4);
        }
        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #121224;
            margin: 10px 0;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
        }
        .shop-btn {
            background: #ff007f;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>⚡ CYBER QUEST: ULTIMATE</h1>
        <div class="stats-bar">
            <div>SKOR: <span id="scoreVal">0</span></div>
            <div>💎 <span id="coinVal">0</span></div>
            <div>CAN: <span id="lifeVal">❤️❤️❤️</span></div>
        </div>
    </header>

    <main>
        <canvas id="gameCanvas" width="360" height="440"></canvas>
    </main>

    <div class="hud-panel">
        <button class="btn" onclick="togglePause()">DURDUR</button>
        <button class="btn" style="background: linear-gradient(45deg, #ff007f, #7f00ff); color:#fff;" onclick="openShop()">🛒 MAĞAZA</button>
    </div>

    <!-- MAĞAZA EKRANI -->
    <div id="shopModal">
        <div class="shop-box">
            <h2 style="color: #00ffcc; margin-bottom: 15px;">CYBER MAĞAZA</h2>
            <div class="shop-item">
                <span>Çift Lazer (15 💎)</span>
                <button class="shop-btn" onclick="buyUpgrade('doubleLaser')">AL</button>
            </div>
            <div class="shop-item">
                <span>Enerji Kalkanı (25 💎)</span>
                <button class="shop-btn" onclick="buyUpgrade('shield')">AL</button>
            </div>
            <div class="shop-item">
                <span>Hız Artışı (10 💎)</span>
                <button class="shop-btn" onclick="buyUpgrade('speed')">AL</button>
            </div>
            <button class="btn" style="margin-top: 15px; width: 100%;" onclick="closeShop()">OYUNA DÖN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const scoreVal = document.getElementById("scoreVal");
        const coinVal = document.getElementById("coinVal");
        const lifeVal = document.getElementById("lifeVal");
        const shopModal = document.getElementById("shopModal");

        let score = 0;
        let coins = 0;
        let lives = 3;
        let isPaused = false;
        let gameOver = false;
        let gameStarted = false;
        let level = 1;

        // Mağaza Geliştirmeleri
        let hasDoubleLaser = false;
        let hasShield = false;
        let speedLevel = 1;

        // Boss Sistemi
        let bossActive = false;
        let boss = { x: 130, y: -100, w: 100, h: 50, hp: 50, maxHp: 50, dir: 2 };

        // Ses Efektleri (Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'laser') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'explosion') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(20, audioCtx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.start(); osc.stop(audioCtx.currentTime + 0.25);
            } else if (type === 'coin') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(900, audioCtx.currentTime);
                osc.frequency.setValueAtTime(1400, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            }
        }

        let player = {
            x: canvas.width / 2,
            y: canvas.height - 50,
            w: 36,
            h: 36,
            speed: 5
        };

        let bullets = [];
        let enemies = [];
        let particles = [];
        let floatingTexts = [];
        let stars = [];

        for (let i = 0; i < 50; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 0.5,
                speed: Math.random() * 1.5 + 0.5
            });
        }

        let touchX = player.x;
        let isTouching = false;

        canvas.addEventListener("pointerdown", (e) => {
            isTouching = true;
            updateTouchPos(e);
            if (!gameStarted || gameOver) resetGame();
        });
        canvas.addEventListener("pointermove", (e) => { if (isTouching) updateTouchPos(e); });
        canvas.addEventListener("pointerup", () => { isTouching = false; });

        function updateTouchPos(e) {
            const rect = canvas.getBoundingClientRect();
            touchX = e.clientX - rect.left;
        }

        let keys = {};
        window.addEventListener("keydown", (e) => { keys[e.code] = true; if(e.code === "Space" && (!gameStarted || gameOver)) resetGame(); });
        window.addEventListener("keyup", (e) => { keys[e.code] = false; });

        function resetGame() {
            score = 0;
            coins = 0;
            lives = 3;
            level = 1;
            bullets = [];
            enemies = [];
            particles = [];
            bossActive = false;
            gameOver = false;
            gameStarted = true;
        }

        function togglePause() {
            if (gameStarted && !gameOver) {
                isPaused = !isPaused;
                if(isPaused) shopModal.style.display = "flex";
                else shopModal.style.display = "none";
            }
        }

        function openShop() {
            isPaused = true;
            shopModal.style.display = "flex";
        }

        function closeShop() {
            shopModal.style.display = "none";
            isPaused = false;
        }

        function buyUpgrade(item) {
            if (item === 'doubleLaser' && coins >= 15 && !hasDoubleLaser) {
                coins -= 15;
                hasDoubleLaser = true;
                alert("Çifte Lazer Kilidi Açıldı!");
            } else if (item === 'shield' && coins >= 25 && !hasShield) {
                coins -= 25;
                hasShield = true;
                alert("Enerji Kalkanı Aktif!");
            } else if (item === 'speed' && coins >= 10 && speedLevel < 3) {
                coins -= 10;
                speedLevel++;
                player.speed += 2;
                alert("Gem Hızı Arttırıldı!");
            } else {
                alert("Yetersiz Elmas veya Zaten Alınmış!");
            }
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 0.5) * 5,
                    radius: Math.random() * 3 + 1,
                    color, alpha: 1
                });
            }
        }

        function addFloatingText(text, x, y, color) {
            floatingTexts.push({ text, x, y, alpha: 1, color });
        }

        let frameCount = 0;
        function update() {
            if (!gameStarted || isPaused || gameOver) return;

            frameCount++;
            level = Math.floor(score / 80) + 1;

            // Boss tetikleme (Her 100 skorda bir)
            if (score > 0 && score % 100 === 0 && !bossActive) {
                bossActive = true;
                boss.hp = 50 + level * 20;
                boss.maxHp = boss.hp;
                boss.y = -60;
            }

            stars.forEach(star => {
                star.y += star.speed;
                if (star.y > canvas.height) star.y = 0;
            });

            if (isTouching) {
                let dx = touchX - player.x;
                player.x += dx * 0.25;
            }
            if (keys["ArrowLeft"] || keys["KeyA"]) player.x -= player.speed;
            if (keys["ArrowRight"] || keys["KeyD"]) player.x += player.speed;

            if (player.x < player.w / 2) player.x = player.w / 2;
            if (player.x > canvas.width - player.w / 2) player.x = canvas.width - player.w / 2;

            // Ateş Etme
            if (frameCount % 10 === 0) {
                if (hasDoubleLaser) {
                    bullets.push({ x: player.x - 10, y: player.y - 15, w: 3, h: 12, speed: 10 });
                    bullets.push({ x: player.x + 10, y: player.y - 15, w: 3, h: 12, speed: 10 });
                } else {
                    bullets.push({ x: player.x, y: player.y - 15, w: 4, h: 12, speed: 10 });
                }
                playSound('laser');
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.y -= b.speed;
                if (b.y < 0) bullets.splice(i, 1);
            }

            // Boss Mantığı
            if (bossActive) {
                if (boss.y < 40) boss.y += 1;
                boss.x += boss.dir;
                if (boss.x < 30 || boss.x > canvas.width - 130) boss.dir *= -1;

                // Boss Mermi Çarpışması
                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j];
                    if (b.x > boss.x && b.x < boss.x + boss.w && b.y > boss.y && b.y < boss.y + boss.h) {
                        boss.hp--;
                        bullets.splice(j, 1);
                        createExplosion(b.x, b.y, '#ff007f');
                        if (boss.hp <= 0) {
                            bossActive = false;
                            score += 100;
                            coins += 15;
                            playSound('explosion');
                            addFloatingText("+100 BOSS", boss.x, boss.y, '#00ffcc');
                        }
                    }
                }
            } else {
                // Normal Düşman Üretimi
                if (frameCount % Math.max(25, 60 - level * 4) === 0) {
                    let w = 32, h = 32, hp = 1, speed = 2 + level * 0.2, color = '#ff007f';
                    enemies.push({ x: Math.random() * (canvas.width - w), y: -40, w, h, hp, speed, color });
                }

                for (let i = enemies.length - 1; i >= 0; i--) {
                    let e = enemies[i];
                    e.y += e.speed;

                    let dist = Math.hypot(player.x - (e.x + e.w/2), player.y - (e.y + e.h/2));
                    if (dist < player.w / 2 + e.w / 2) {
                        if (hasShield) { hasShield = false; addFloatingText("KALKAN KIRILDI!", player.x, player.y - 20, '#ffaa00'); }
                        else { lives--; }
                        createExplosion(e.x, e.y, '#ff0000');
                        playSound('explosion');
                        enemies.splice(i, 1);
                        if (lives <= 0) gameOver = true;
                        continue;
                    }

                    if (e.y > canvas.height) { enemies.splice(i, 1); continue; }

                    for (let j = bullets.length - 1; j >= 0; j--) {
                        let b = bullets[j];
                        if (b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h) {
                            bullets.splice(j, 1);
                            coins += Math.random() < 0.4 ? 1 : 0; // Şanslı Elmas
                            score += 10;
                            playSound('explosion');
                            createExplosion(e.x, e.y, e.color);
                            addFloatingText("+10", e.x, e.y, '#00ffcc');
                            enemies.splice(i, 1);
                            break;
                        }
                    }
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.alpha -= 0.03;
                if (p.alpha <= 0) particles.splice(i, 1);
            }

            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                let ft = floatingTexts[i];
                ft.y -= 1; ft.alpha -= 0.02;
                if (ft.alpha <= 0) floatingTexts.splice(i, 1);
            }

            scoreVal.innerText = score;
            coinVal.innerText = coins;
            lifeVal.innerText = "❤️".repeat(Math.max(0, lives));
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#ffffff";
            stars.forEach(star => {
                ctx.globalAlpha = star.size / 2.5;
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });
            ctx.globalAlpha = 1;

            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            });

            floatingTexts.forEach(ft => {
                ctx.save();
                ctx.globalAlpha = ft.alpha;
                ctx.fillStyle = ft.color;
                ctx.font = "bold 13px Arial";
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.restore();
            });

            if (!gameStarted) {
                ctx.fillStyle = "rgba(11, 11, 22, 0.9)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#00ffcc";
                ctx.font = "bold 22px Arial";
                ctx.textAlign = "center";
                ctx.fillText("CYBER QUEST ULTIMATE", canvas.width / 2, canvas.height / 2 - 30);
                ctx.fillStyle = "#ffffff";
                ctx.font = "14px Arial";
                ctx.fillText("Başlamak İçin Dokun", canvas.width / 2, canvas.height / 2 + 15);
                ctx.textAlign = "left";
                return;
            }

            // BOSS Çizimi
            if (bossActive) {
                ctx.fillStyle = "#ff007f";
                ctx.fillRect(boss.x, boss.y, boss.w, boss.h);
                // Boss Can Barı
                ctx.fillStyle = "#333";
                ctx.fillRect(boss.x, boss.y - 10, boss.w, 6);
                ctx.fillStyle = "#00ffcc";
                ctx.fillRect(boss.x, boss.y - 10, boss.w * (boss.hp / boss.maxHp), 6);
            }

            ctx.fillStyle = "#00ffcc";
            bullets.forEach(b => ctx.fillRect(b.x - b.w/2, b.y, b.w, b.h));

            // Oyuncu Gemisi (Geliştirmelere göre şekil değiştirir!)
            ctx.fillStyle = hasDoubleLaser ? "#ff00ff" : "#00ffcc";
            ctx.beginPath();
            ctx.moveTo(player.x, player.y - player.h/2);
            ctx.lineTo(player.x - player.w/2, player.y + player.h/2);
            ctx.lineTo(player.x, player.y + player.h/3);
            ctx.lineTo(player.x + player.w/2, player.y + player.h/2);
            ctx.closePath();
            ctx.fill();

            // Kalkan Efekti
            if (hasShield) {
                ctx.strokeStyle = "#00aaff";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(player.x, player.y, player.w, 0, Math.PI * 2);
                ctx.stroke();
            }

            enemies.forEach(e => {
                ctx.fillStyle = e.color;
                ctx.fillRect(e.x, e.y, e.w, e.h);
            });

            if (gameOver) {
                ctx.fillStyle = "rgba(5, 5, 15, 0.95)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ff007f";
                ctx.font = "bold 26px Arial";
                ctx.textAlign = "center";
                ctx.fillText("OYUN BİTTİ", canvas.width / 2, canvas.height / 2 - 25);
                ctx.fillStyle = "#ffffff";
                ctx.font = "16px Arial";
                ctx.fillText("Skor: " + score, canvas.width / 2, canvas.height / 2 + 15);
                ctx.fillText("Yeniden Başlamak İçin Dokun", canvas.width / 2, canvas.height / 2 + 45);
                ctx.textAlign = "left";
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
