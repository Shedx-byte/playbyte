<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HoleConquest.io - 3D Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #05050f; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; touch-action: none; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .hud { position: absolute; z-index: 10; color: #fff; pointer-events: none; }
        .btn-io { background: linear-gradient(135deg, #00f0ff, #7000ff); border: 2px solid #00f0ff; color: #fff; font-weight: 900; padding: 16px 36px; border-radius: 40px; box-shadow: 0 0 25px rgba(0,240,255,0.6); cursor: pointer; pointer-events: auto; transition: all 0.2s; text-transform: uppercase; letter-spacing: 2px; }
        .btn-io:hover { transform: scale(1.05); box-shadow: 0 0 35px rgba(0,240,255,0.9); }
        .btn-io:active { transform: scale(0.95); }
        .io-input { background: rgba(15, 15, 35, 0.85); border: 2px solid #00f0ff; border-radius: 30px; padding: 14px 24px; color: #fff; text-align: center; font-weight: bold; outline: none; box-shadow: 0 0 15px rgba(0,240,255,0.3); transition: all 0.3s; }
        .io-input:focus { border-color: #ff007f; box-shadow: 0 0 25px rgba(255,0,127,0.6); }
        .io-panel { background: rgba(10, 10, 25, 0.85); border: 1px solid rgba(0,240,255,0.3); backdrop-filter: blur(16px); border-radius: 24px; box-shadow: 0 0 40px rgba(0,0,0,0.8); }
        .skin-btn { width: 42px; height: 42px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.3); cursor: pointer; pointer-events: auto; transition: transform 0.2s, border-color 0.2s; }
        .skin-btn.selected { transform: scale(1.25); border-color: #00f0ff; box-shadow: 0 0 20px #00f0ff; }
        
        /* DOKUNMATİK JOYSTICK CİZGİSİ */
        #joystick-base { position: absolute; width: 120px; height: 120px; border: 2px dashed rgba(0, 240, 255, 0.4); border-radius: 50%; pointer-events: none; display: none; transform: translate(-50%, -50%); }
        #joystick-stick { position: absolute; width: 50px; height: 50px; background: radial-gradient(circle, #00f0ff, #7000ff); border-radius: 50%; pointer-events: none; display: none; transform: translate(-50%, -50%); box-shadow: 0 0 15px #00f0ff; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- JOYSTICK ELEMENTLERİ -->
    <div id="joystick-base"></div>
    <div id="joystick-stick"></div>

    <!-- PROFESYONEL OYUN LOBİSİ (MENU OVERLAY) -->
    <div id="menu-overlay" class="absolute inset-0 z-30 flex flex-col items-center justify-center bg-black/80 backdrop-blur-md px-4">
        <div class="io-panel p-8 max-w-md w-full text-center flex flex-col items-center border-cyan-500/40 relative overflow-hidden">
            
            <div class="absolute -top-10 -left-10 w-32 h-32 background:radial-gradient(#00f0ff, transparent) opacity-20 blur-xl"></div>
            
            <h1 class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-purple-500 to-pink-500 mb-1 tracking-widest drop-shadow-[0_0_25px_rgba(0,240,255,0.8)]">HOLE<span class="text-cyan-400">.IO</span></h1>
            <p class="text-xs text-cyan-300 font-mono mb-6 uppercase tracking-widest">3D Karadelik Arenası</p>

            <!-- OYUN MODU SEÇİMİ -->
            <div class="flex gap-2 mb-6 w-full pointer-events-auto">
                <button class="flex-1 py-2 rounded-xl border border-cyan-500/50 bg-cyan-950/40 text-cyan-300 text-xs font-bold font-mono">CLASSIC ARENA</button>
                <button class="flex-1 py-2 rounded-xl border border-purple-500/30 bg-purple-950/20 text-gray-400 text-xs font-bold font-mono opacity-60 cursor-not-allowed">BATTLE ROYALE</button>
            </div>

            <!-- OYUNCU ADI -->
            <input type="text" id="username" placeholder="RUMUZUNU GIR" class="io-input w-full mb-6 text-sm tracking-wider" maxlength="12">

            <!-- DELİK / SKIN RENGİ -->
            <div class="mb-8 w-full">
                <p class="text-xs text-gray-400 mb-3 font-mono">DELİK ENERJİ RENGİ</p>
                <div class="flex justify-center gap-4">
                    <div class="skin-btn selected" style="background:#00f0ff;" onclick="setSkin(0x00f0ff, this)"></div>
                    <div class="skin-btn" style="background:#ff0055;" onclick="setSkin(0xff0055, this)"></div>
                    <div class="skin-btn" style="background:#00ff66;" onclick="setSkin(0x00ff66, this)"></div>
                    <div class="skin-btn" style="background:#aa00ff;" onclick="setSkin(0xaa00ff, this)"></div>
                    <div class="skin-btn" style="background:#ffaa00;" onclick="setSkin(0xffaa00, this)"></div>
                </div>
            </div>

            <button class="btn-io w-full text-base" onclick="startGame()">ARENAYA KATIL 🚀</button>
        </div>
    </div>

    <!-- OYUN HUD & LİDERLİK TABLOSU -->
    <div id="game-hud" class="hud top-5 left-5 right-5 flex justify-between items-start" style="display:none;">
        <div class="io-panel px-5 py-3 font-mono text-cyan-400 text-sm font-black flex flex-col gap-1">
            <div>SKOR: <span id="score-text" class="text-white text-lg">0</span></div>
            <div>BOYUT: <span id="size-text" class="text-yellow-400">1.0x</span></div>
        </div>

        <!-- Canlı Liderlik Tablosu -->
        <div class="io-panel px-5 py-4 font-mono text-xs text-white min-w-[180px]">
            <div class="text-cyan-400 font-bold mb-2 border-b border-cyan-500/30 pb-1 flex justify-between">
                <span>🏆 ARENA KRALLARI</span>
            </div>
            <div id="leaderboard-list" class="flex flex-col gap-1 text-gray-300"></div>
        </div>
    </div>

    <!-- OYUN BİTTİ EKRANI -->
    <div id="gameover-overlay" class="absolute inset-0 z-40 flex flex-col items-center justify-center bg-black/95 px-4" style="display:none;">
        <div class="io-panel p-8 max-w-sm w-full text-center flex flex-col items-center border-red-500/60 shadow-[0_0_50px_rgba(255,0,85,0.4)]">
            <h2 class="text-3xl font-black text-red-500 mb-1 tracking-wider drop-shadow-[0_0_10px_#ff0055]">YUTULDUN!</h2>
            <p id="final-rank" class="text-cyan-400 font-bold text-sm mb-1 font-mono">Sıralama: #1</p>
            <p id="final-score" class="text-gray-300 text-sm mb-6 font-mono">Skor: 0</p>
            <button class="btn-io w-full text-base bg-gradient-to-r from-red-500 to-pink-600 border-red-400" onclick="returnToMenu()">TEKRAR DENE</button>
        </div>
    </div>

    <script>
        // WEB AUDIO API (Ses Sistemi)
        let audioCtx = null;
        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        function playSound(type) {
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            let now = audioCtx.currentTime;

            if (type === 'eat') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.12);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.start(now); osc.stop(now + 0.12);
            } else if (type === 'crash') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.linearRampToValueAtTime(30, now + 0.3);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            }
        }

        let scene, camera, renderer, playerHole;
        let isPlaying = false;
        let playerColor = 0x00f0ff;
        let playerUser = "Shedx";
        let holeRadius = 1.2;
        let score = 0;
        let foodList = [];
        let botList = [];

        // Joystick Değişkenleri
        let joystickActive = false;
        let touchStart = { x: 0, y: 0 };
        let moveDir = { x: 0, z: 0 };

        const botNames = ["VoidKing", "Nexus", "Nebula", "Glitch", "Titan", "Cosmo"];

        function setSkin(color, el) {
            playerColor = color;
            document.querySelectorAll('.skin-btn').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected');
        }

        function init() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x05050f);
            scene.fog = new THREE.FogExp2(0x05050f, 0.015);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 25, 20);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Işıklar
            const ambient = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambient);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight.position.set(20, 40, 20);
            scene.add(dirLight);

            // 3D Grid Zemin
            const floorGeo = new THREE.PlaneGeometry(160, 160);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x0c0c20, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const gridHelper = new THREE.GridHelper(160, 40, 0x00f0ff, 0x151535);
            gridHelper.position.y = 0.01;
            scene.add(gridHelper);

            // Oyuncu Karadeliği
            createPlayerHole();

            window.addEventListener('resize', onWindowResize);
            setupTouchControls();
            setupKeyboard();
        }

        function createPlayerHole() {
            playerHole = new THREE.Group();
            
            // Siyah Merkez Delik
            const holeGeo = new THREE.CylinderGeometry(holeRadius, holeRadius, 0.1, 32);
            const holeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            const innerHole = new THREE.Mesh(holeGeo, holeMat);
            innerHole.position.y = 0.05;
            playerHole.add(innerHole);

            // Parlayan Neon Halka
            const ringGeo = new THREE.RingGeometry(holeRadius, holeRadius + 0.3, 32);
            const ringMat = new THREE.MeshBasicMaterial({ color: playerColor, side: THREE.DoubleSide });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = -Math.PI / 2;
            ring.position.y = 0.06;
            playerHole.add(ring);

            playerHole.position.set(0, 0, 0);
            scene.add(playerHole);
        }

        function spawnFood() {
            for(let i = 0; i < 80; i++) {
                let size = 0.4 + Math.random() * 0.6;
                let geo = new THREE.BoxGeometry(size, size, size);
                let mat = new THREE.MeshStandardMaterial({ 
                    color: Math.random() * 0xffffff,
                    roughness: 0.3
                });
                let mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(
                    (Math.random() - 0.5) * 140,
                    size / 2,
                    (Math.random() - 0.5) * 140
                );
                scene.add(mesh);
                foodList.push({ mesh: mesh, size: size });
            }
        }

        function spawnBots() {
            botList = [];
            botNames.forEach((name) => {
                let radius = 1.0 + Math.random() * 0.8;
                let group = new THREE.Group();
                
                let inner = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, 0.1, 32), new THREE.MeshBasicMaterial({ color: 0x000000 }));
                inner.position.y = 0.05;
                group.add(inner);

                let ring = new THREE.Mesh(new THREE.RingGeometry(radius, radius + 0.2, 32), new THREE.MeshBasicMaterial({ color: Math.random() * 0xffffff, side: THREE.DoubleSide }));
                ring.rotation.x = -Math.PI / 2;
                ring.position.y = 0.06;
                group.add(ring);

                group.position.set((Math.random() - 0.5) * 120, 0, (Math.random() - 0.5) * 120);
                scene.add(group);

                botList.push({ name: name, mesh: group, radius: radius, score: Math.floor(radius * 100) });
            });
        }

        function setupTouchControls() {
            const base = document.getElementById('joystick-base');
            const stick = document.getElementById('joystick-stick');

            window.addEventListener('pointerdown', (e) => {
                if(!isPlaying) return;
                joystickActive = true;
                touchStart = { x: e.clientX, y: e.clientY };

                base.style.left = `${e.clientX}px`;
                base.style.top = `${e.clientY}px`;
                stick.style.left = `${e.clientX}px`;
                stick.style.top = `${e.clientY}px`;
                base.style.display = 'block';
                stick.style.display = 'block';
            });

            window.addEventListener('pointermove', (e) => {
                if(!joystickActive) return;
                let dx = e.clientX - touchStart.x;
                let dy = e.clientY - touchStart.y;
                let dist = Math.hypot(dx, dy);
                let maxDist = 50;

                if (dist > maxDist) {
                    dx = (dx / dist) * maxDist;
                    dy = (dy / dist) * maxDist;
                }

                stick.style.left = `${touchStart.x + dx}px`;
                stick.style.top = `${touchStart.y + dy}px`;

                moveDir.x = dx / maxDist;
                moveDir.z = dy / maxDist;
            });

            window.addEventListener('pointerup', () => {
                joystickActive = false;
                moveDir = { x: 0, z: 0 };
                base.style.display = 'none';
                stick.style.display = 'none';
            });
        }

        function setupKeyboard() {
            window.addEventListener('keydown', (e) => {
                if(!isPlaying) return;
                if(e.key === 'ArrowUp' || e.key === 'w') moveDir.z = -1;
                if(e.key === 'ArrowDown' || e.key === 's') moveDir.z = 1;
                if(e.key === 'ArrowLeft' || e.key === 'a') moveDir.x = -1;
                if(e.key === 'ArrowRight' || e.key === 'd') moveDir.x = 1;
            });
            window.addEventListener('keyup', () => {
                moveDir = { x: 0, z: 0 };
            });
        }

        function updateLeaderboard() {
            let all = [{ name: playerUser, score: score, isPlayer: true }];
            botList.forEach(b => all.push({ name: b.name, score: b.score, isPlayer: false }));
            all.sort((a, b) => b.score - a.score);

            let html = "";
            let rank = 1;
            all.forEach((p, idx) => {
                if(p.isPlayer) rank = idx + 1;
                if(idx < 5) {
                    let colorClass = p.isPlayer ? "text-cyan-400 font-bold" : "text-gray-300";
                    html += `<div class="flex justify-between ${colorClass}"><span>${idx+1}. ${p.name}</span><span>${p.score}</span></div>`;
                }
            });
            document.getElementById("leaderboard-list").innerHTML = html;
            return rank;
        }

        function startGame() {
            initAudio();
            const nameInput = document.getElementById("username").value.trim();
            if(!nameInput) { alert("Lütfen rumuzunu gir!"); return; }

            playerUser = nameInput;
            playerHole.children[1].material.color.setHex(playerColor);

            document.getElementById("menu-overlay").style.display = "none";
            document.getElementById("gameover-overlay").style.display = "none";
            document.getElementById("game-hud").style.display = "flex";

            holeRadius = 1.2; score = 0;
            playerHole.scale.set(1, 1, 1);
            playerHole.position.set(0, 0, 0);

            foodList.forEach(f => scene.remove(f.mesh));
            botList.forEach(b => scene.remove(b.mesh));
            foodList = []; botList = [];

            spawnFood();
            spawnBots();
            isPlaying = true;
        }

        function gameOver() {
            isPlaying = false;
            playSound('crash');
            let rank = updateLeaderboard();

            document.getElementById("game-hud").style.display = "none";
            document.getElementById("gameover-overlay").style.display = "flex";
            document.getElementById("final-rank").innerText = `Arena Sıralaman: #${rank}`;
            document.getElementById("final-score").innerText = `Toplam Skor: ${score}`;
        }

        function returnToMenu() {
            document.getElementById("gameover-overlay").style.display = "none";
            document.getElementById("menu-overlay").style.display = "flex";
        }

        function animate() {
            requestAnimationFrame(animate);

            if(isPlaying) {
                // Karadelik Hareketi
                let speed = 0.22;
                playerHole.position.x += moveDir.x * speed;
                playerHole.position.z += moveDir.z * speed;

                // Sınırlar
                playerHole.position.x = Math.max(-75, Math.min(75, playerHole.position.x));
                playerHole.position.z = Math.max(-75, Math.min(75, playerHole.position.z));

                // Kamera Takibi
                camera.position.x = playerHole.position.x;
                camera.position.z = playerHole.position.z + 18 + (holeRadius * 3);
                camera.lookAt(playerHole.position.x, 0, playerHole.position.z);

                // Yiyecek Yutma Kontrolü
                for(let i = foodList.length - 1; i >= 0; i--) {
                    let food = foodList[i];
                    let dist = playerHole.position.distanceTo(food.mesh.position);

                    if(dist < holeRadius) {
                        playSound('eat');
                        scene.remove(food.mesh);
                        foodList.splice(i, 1);
                        score += 15;
                        holeRadius += 0.03;
                        playerHole.scale.set(holeRadius / 1.2, 1, holeRadius / 1.2);
                    }
                }

                // Bot Yapay Zekası ve Yutma
                botList.forEach((bot, idx) => {
                    bot.mesh.position.x += (Math.sin(Date.now() * 0.001 + idx) * 0.1);
                    bot.mesh.position.z += (Math.cos(Date.now() * 0.001 + idx) * 0.1);

                    let dist = playerHole.position.distanceTo(bot.mesh.position);
                    if(dist < holeRadius && holeRadius > bot.radius * 1.2) {
                        // Oyuncu botu yuttu!
                        playSound('eat');
                        scene.remove(bot.mesh);
                        botList.splice(idx, 1);
                        score += 100;
                        holeRadius += 0.2;
                        playerHole.scale.set(holeRadius / 1.2, 1, holeRadius / 1.2);
                    } else if(dist < bot.radius && bot.radius > holeRadius * 1.2) {
                        // Bot oyuncuyu yuttu!
                        gameOver();
                    }
                });

                document.getElementById("score-text").innerText = score;
                document.getElementById("size-text").innerText = (holeRadius).toFixed(1) + "x";
                updateLeaderboard();
            }

            renderer.render(scene, camera);
        }

        init();
        animate();

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
