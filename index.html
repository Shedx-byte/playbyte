<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlayByte - Cyber Quest Efsanesi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0b0b16;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            overflow: hidden;
            touch-action: none;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        header {
            padding: 10px;
            background: linear-gradient(180deg, #15152b, transparent);
        }
        h1 {
            color: #00ffcc;
            font-size: 22px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0,255,204,0.5);
        }
        .stats-bar {
            display: flex;
            justify-content: space-around;
            font-size: 14px;
            color: #a0a0c0;
            margin-top: 5px;
        }
        .stats-bar span {
            color: #ff007f;
            font-weight: bold;
        }
        #gameCanvas {
            background: radial-gradient(circle at center, #1b1b3a 0%, #05050f 100%);
            display: block;
            margin: 0 auto;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
            border-radius: 8px;
        }
        .hud-panel {
            padding: 10px;
            background: #121224;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .btn {
            background: linear-gradient(45deg, #00ffcc, #0077ff);
            color: #000;
            border: none;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,255,204,0.4);
        }
        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <header>
        <h1>⚡ PLAYBYTE: CYBER QUEST</h1>
        <div class="stats-bar">
            <div>SKOR: <span id="scoreVal">0</span></div>
            <div>ELMAS: <span id="coinVal">0</span></div>
            <div>CAN: <span id="lifeVal">❤️❤️❤️</span></div>
        </div>
    </header>

    <main>
        <canvas id="gameCanvas" width="360" height="480"></canvas>
    </main>

    <div class="hud-panel">
        <button class="btn" onclick="togglePause()">DURDUR / DEVAM</button>
        <button class="btn" style="background: linear-gradient(45deg, #ff007f, #7f00ff); color:#fff;" onclick="openShop()">MAĞAZA</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // UI Elementleri
        const scoreVal = document.getElementById("scoreVal");
        const coinVal = document.getElementById("coinVal");
        const lifeVal = document.getElementById("lifeVal");

        // Oyun Durumu
        let score = 0;
        let coins = 0;
        let lives = 3;
        let isPaused = false;
        let gameOver = false;
        let gameStarted = false;
        let level = 1;

        // Web Audio API (Harici ses dosyası olmadan kendi ses efektlerimizi üretiriz!)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'laser') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'explosion') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(30, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'coin') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.setValueAtTime(1200, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            }
        }

        // Oyuncu Gemisi
        let player = {
            x: canvas.width / 2,
            y: canvas.height - 60,
            w: 36,
            h: 36,
            speed: 5,
            color: '#00ffcc'
        };

        let bullets = [];
        let enemies = [];
        let particles = [];
        let floatingTexts = [];
        let stars = [];

        // Arka plan yıldızları
        for (let i = 0; i < 60; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 0.5,
                speed: Math.random() * 1.5 + 0.5
            });
        }

        // Kontroller (Dokunma & Fare)
        let touchX = player.x;
        let isTouching = false;

        canvas.addEventListener("pointerdown", (e) => {
            isTouching = true;
            updateTouchPos(e);
            if (!gameStarted || gameOver) {
                resetGame();
            }
        });

        canvas.addEventListener("pointermove", (e) => {
            if (isTouching) updateTouchPos(e);
        });

        canvas.addEventListener("pointerup", () => { isTouching = false; });

        function updateTouchPos(e) {
            const rect = canvas.getBoundingClientRect();
            touchX = e.clientX - rect.left;
        }

        // Klavye Kontrolleri (Bilgisayar için)
        let keys = {};
        window.addEventListener("keydown", (e) => { keys[e.code] = true; if(e.code === "Space" && (!gameStarted || gameOver)) resetGame(); });
        window.addEventListener("keyup", (e) => { keys[e.code] = false; });

        function resetGame() {
            score = 0;
            coins = 0;
            lives = 3;
            level = 1;
            bullets = [];
            enemies = [];
            particles = [];
            gameOver = false;
            gameStarted = true;
        }

        function togglePause() {
            if (gameStarted && !gameOver) isPaused = !isPaused;
        }

        function openShop() {
            alert("Mağaza yakında aktif! Topladığın elmaslarla özel gemiler alabileceksin.");
        }

        // Efekt Parçacıkları Oluşturucu
        function createExplosion(x, y, color) {
            for (let i = 0; i < 12; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    radius: Math.random() * 3 + 1,
                    color: color,
                    alpha: 1
                });
            }
        }

        // Akıcı Metin Efektleri
        function addFloatingText(text, x, y, color) {
            floatingTexts.push({ text, x, y, alpha: 1, color });
        }

        // Düşman Üretimi
        let frameCount = 0;
        function spawnEnemies() {
            if (frameCount % Math.max(30, 70 - level * 5) === 0) {
                let types = ['drone', 'fighter', 'tank'];
                let type = types[Math.floor(Math.random() * Math.min(types.length, level))];
                let w = 30, h = 30, hp = 1, speed = 2 + level * 0.3, color = '#ff007f';

                if (type === 'fighter') { w = 34; h = 34; hp = 2; color = '#ffaa00'; }
                if (type === 'tank') { w = 44; h = 44; hp = 4; speed = 1; color = '#9900ff'; }

                enemies.push({
                    x: Math.random() * (canvas.width - w),
                    y: -50,
                    w, h, hp, maxHp: hp, speed, color, type
                });
            }
        }

        // Oyun Mantığı Güncelleme
        function update() {
            if (!gameStarted || isPaused || gameOver) return;

            frameCount++;

            // Seviye İlerleme
            level = Math.floor(score / 50) + 1;

            // Yıldızların Hareketleri
            stars.forEach(star => {
                star.y += star.speed;
                if (star.y > canvas.height) star.y = 0;
            });

            // Oyuncu Hareketi (Dokunma ve Klavye)
            if (isTouching) {
                let dx = touchX - player.x;
                player.x += dx * 0.2;
            }
            if (keys["ArrowLeft"] || keys["KeyA"]) player.x -= player.speed;
            if (keys["ArrowRight"] || keys["KeyD"]) player.x += player.speed;

            // Sınır Kontrolü
            if (player.x < player.w / 2) player.x = player.w / 2;
            if (player.x > canvas.width - player.w / 2) player.x = canvas.width - player.w / 2;

            // Otomatik Ateş Etme
            if (frameCount % 12 === 0) {
                bullets.push({ x: player.x, y: player.y - 20, w: 4, h: 14, speed: 10 });
                playSound('laser');
            }

            // Mermiler
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.y -= b.speed;
                if (b.y < 0) bullets.splice(i, 1);
            }

            // Düşmanlar
            spawnEnemies();
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.y += e.speed;

                // Oyuncu ile Düşman Çarpışması
                let dist = Math.hypot(player.x - (e.x + e.w/2), player.y - (e.y + e.h/2));
                if (dist < player.w / 2 + e.w / 2) {
                    lives--;
                    createExplosion(e.x + e.w/2, e.y + e.h/2, '#ff0000');
                    playSound('explosion');
                    enemies.splice(i, 1);
                    if (lives <= 0) gameOver = true;
                    continue;
                }

                // Ekran dışı düşman
                if (e.y > canvas.height) {
                    enemies.splice(i, 1);
                    continue;
                }

                // Mermi - Düşman Çarpışması
                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j];
                    if (
                        b.x > e.x && b.x < e.x + e.w &&
                        b.y > e.y && b.y < e.y + e.h
                    ) {
                        e.hp--;
                        bullets.splice(j, 1);
                        createExplosion(b.x, b.y, '#00ffcc');

                        if (e.hp <= 0) {
                            score += e.type === 'tank' ? 30 : (e.type === 'fighter' ? 20 : 10);
                            coins += Math.floor(Math.random() * 2) + 1;
                            playSound('explosion');
                            createExplosion(e.x + e.w/2, e.y + e.h/2, e.color);
                            addFloatingText("+" + (e.type === 'tank' ? 30 : 10), e.x, e.y, '#00ffcc');
                            enemies.splice(i, 1);
                        }
                        break;
                    }
                }
            }

            // Parçacık Güncelleme
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;
                if (p.alpha <= 0) particles.splice(i, 1);
            }

            // Uçan Metin Güncelleme
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                let ft = floatingTexts[i];
                ft.y -= 1;
                ft.alpha -= 0.02;
                if (ft.alpha <= 0) floatingTexts.splice(i, 1);
            }

            // UI Güncelleme
            scoreVal.innerText = score;
            coinVal.innerText = coins;
            lifeVal.innerText = "❤️".repeat(Math.max(0, lives));
        }

        // Çizim Motoru (Graphics Engine)
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Yıldızları Çiz
            ctx.fillStyle = "#ffffff";
            stars.forEach(star => {
                ctx.globalAlpha = star.size / 2.5;
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });
            ctx.globalAlpha = 1;

            // Parçacıkları Çiz
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // Uçan Metinleri Çiz
            floatingTexts.forEach(ft => {
                ctx.save();
                ctx.globalAlpha = ft.alpha;
                ctx.fillStyle = ft.color;
                ctx.font = "bold 14px Arial";
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.restore();
            });

            if (!gameStarted) {
                ctx.fillStyle = "rgba(11, 11, 22, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#00ffcc";
                ctx.font = "bold 24px Arial";
                ctx.textAlign = "center";
                ctx.fillText("CYBER QUEST", canvas.width / 2, canvas.height / 2 - 40);
                ctx.fillStyle = "#ffffff";
                ctx.font = "16px Arial";
                ctx.fillText("Başlamak İçin Ekrana Dokun", canvas.width / 2, canvas.height / 2 + 10);
                ctx.fillStyle = "#ff007f";
                ctx.font = "12px Arial";
                ctx.fillText("Düşmanları yok et, puanları topla!", canvas.width / 2, canvas.height / 2 + 45);
                ctx.textAlign = "left";
                return;
            }

            // Mermileri Çiz (Neon Efektli)
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#00ffcc";
            ctx.fillStyle = "#00ffcc";
            bullets.forEach(b => {
                ctx.fillRect(b.x - b.w/2, b.y, b.w, b.h);
            });

            // Oyuncu Gemisini Çiz (Cyberpunk Stil)
            ctx.shadowColor = player.color;
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.moveTo(player.x, player.y - player.h/2);
            ctx.lineTo(player.x - player.w/2, player.y + player.h/2);
            ctx.lineTo(player.x, player.y + player.h/3);
            ctx.lineTo(player.x + player.w/2, player.y + player.h/2);
            ctx.closePath();
            ctx.fill();

            // Düşmanları Çiz
            enemies.forEach(e => {
                ctx.shadowColor = e.color;
                ctx.fillStyle = e.color;
                ctx.fillRect(e.x, e.y, e.w, e.h);
                // Düşman detayı
                ctx.fillStyle = "#fff";
                ctx.fillRect(e.x + e.w/4, e.y + e.h/4, e.w/2, e.h/2);
            });
            ctx.shadowBlur = 0; // Gölgeyi sıfırla

            // Duraklatma Ekranı
            if (isPaused) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ffaa00";
                ctx.font = "bold 26px Arial";
                ctx.textAlign = "center";
                ctx.fillText("OYUN DURDURULDU", canvas.width / 2, canvas.height / 2);
                ctx.textAlign = "left";
            }

            // Oyun Bitti Ekranı
            if (gameOver) {
                ctx.fillStyle = "rgba(5, 5, 15, 0.9)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ff007f";
                ctx.font = "bold 28px Arial";
                ctx.textAlign = "center";
                ctx.fillText("OYUN BİTTİ", canvas.width / 2, canvas.height / 2 - 40);
                ctx.fillStyle = "#ffffff";
                ctx.font = "18px Arial";
                ctx.fillText("Toplam Skor: " + score, canvas.width / 2, canvas.height / 2 + 5);
                ctx.fillStyle = "#00ffcc";
                ctx.font = "14px Arial";
                ctx.fillText("Yeniden Başlamak İçin Dokun", canvas.width / 2, canvas.height / 2 + 45);
                ctx.textAlign = "left";
            }
        }

        // Ana Oyun Döngüsü
        function mainLoop() {
            update();
            draw();
            requestAnimationFrame(mainLoop);
        }

        mainLoop();
    </script>
</body>
</html>
